# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cloudnative-pg
  namespace: default
  annotations:
    kyverno.io/ignore: "true"
spec:
  bootstrap:
    initdb:
      import:
        type: monolith
        databases:
          - authelia
          - gitea
          - grafana
          - invidious
          - lldap
          - nextcloud
          - paperless-ngx
          - piped
          - planka
          - rxresume
          - sharry
          - synapse
          - vaultwarden
        roles:
          - authelia
          - gitea
          - grafana
          - immich
          - invidious
          - lldap
          - nextcloud
          - paperless-ngx
          - piped
          - planka
          - rxresume
          - sharry
          - synapse
          - vaultwarden
        source:
          externalCluster: postgresql
  externalClusters:
    - name: postgresql
      connectionParameters:
        # Use the correct IP or host name for the source database
        host: postgresql
        user: postgres
        dbname: postgres
      password:
        name: postgresql-superuser
        key: postgres-password
  instances: 1
  imageName: ghcr.io/bo0tzz/cnpgvecto.rs:16.1-v0.1.13
  primaryUpdateStrategy: unsupervised
  storage:
    size: 10Gi
    storageClass: local-hostpath
  superuserSecret:
    name: cloudnative-pg-superuser
  enableSuperuserAccess: true
  postgresql:
    shared_preload_libraries:
      - "vectors.so"
    parameters:
      max_connections: "600"
      max_slot_wal_keep_size: 10GB
      shared_buffers: 512MB
  resources:
    requests:
      memory: "512Mi"
    limits:
      hugepages-2Mi: "512Mi"
  monitoring:
    enablePodMonitor: true
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      wal:
        compression: bzip2
        maxParallel: 8
      destinationPath: s3://postgres/
      endpointURL: https://${S3_ENDPOINT}/${S3_POSTGRESQL_BUCKET}
      serverName: cloudative-pg-v1
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg-superuser
          key: aws-access-key-id
        secretAccessKey:
          name: cloudnative-pg-superuser
          key: aws-secret-access-key
