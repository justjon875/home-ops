---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: &app helloworld
spec:
  chart:
    spec:
      chart: *app
      version: 0.2.1
      sourceRef:
        kind: HelmRepository
        name: crowdsec
        namespace: flux-system
  interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    ingress:
      annotations:
        kubernetes.io/ingress.class: external
      enabled: true
      hosts:
        - host: &host helloworld.habanerojam.xyz
          paths:
            - path: /
      tls:
        - hosts:
            - *host
