---
originRequest:
  originServerName: external.${ROOT_DOMAIN}

ingress:
  - hostname: ${ROOT_DOMAIN}
    service: https://nginx-external-controller.networking.svc.cluster.local:443
  - hostname: "*.${ROOT_DOMAIN}"
    service: https://nginx-external-controller.networking.svc.cluster.local:443
  - service: http_status:404
