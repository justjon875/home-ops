---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: external-dns-adguard-home
  namespace: networking
spec:
  interval: 15m
  chart:
    spec:
      chart: external-dns
      version: 1.14.4
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    interval: 2m
    logLevel: debug
    envFrom:
      - secretRef:
          name: adguard-secret
    env:
      - name: ADGUARD_PASSWORD
        value: ${adguard_home_password}
      - name: SERVER_HOST
        value: 0.0.0.0
    extraArgs:
      - --ingress-class=ingress
      - --webhook-provider-url=http://localhost:8888
    policy: sync
    sources:
      - ingress
    domainFilters:
      - "${ROOT_DOMAIN}"
    resources:
      requests:
        memory: 100Mi
        cpu: 25m
      limits:
        memory: 250Mi
    provider:
      webhook:
        image:
          repository: ghcr.io/muhlba91/external-dns-provider-adguard
          tag: v5.0.1@sha256:d9539a976405f1faa4d27c5c11da2154cd3a65b3cdb7c174668ea4e8845e2755
