apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap
  namespace: infra
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 30m
  maxHistory: 2
  uninstall:
    keepHistory: false
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      lldap:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            env:
              LLDAP_HTTP_PORT: 80
              LLDAP_HTTP_URL: https://lldap.${ROOT_DOMAIN}
              LLDAP_LDAP_PORT: 389
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: lldap-secret
            image:
              repository: ghcr.io/lldap/lldap
              tag: latest-alpine@sha256:3de697c3ba57ffea73450aa6f3f557a3b5a21cb662cfe6b2b60e30f330abc7bf
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: "{{ .Release.Name }}.${ROOT_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - "{{ .Release.Name }}.${ROOT_DOMAIN}"
    persistence:
      data:
        enabled: true
        path: ${NFS_PATH}/lldap
        server: ${NFS_HOST}
        type: nfs
    resources:
      limits:
        memory: 500Mi
      requests:
        cpu: 100m
        memory: 100Mi
    service:
      app:
        controller: lldap
        ports:
          http:
            port: 80
          ldap:
            enabled: true
            port: 389
