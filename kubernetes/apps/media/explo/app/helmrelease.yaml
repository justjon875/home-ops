apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app explo
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      explo:
        containers:
          app:
            env:
              TZ: ${TIMEZONE}
              UI_USERNAME: admin
              UI_PASSWORD: admin
            image:
              repository: ghcr.io/lumepart/explo
              tag: v1.1.0@sha256:31b08b4693b412d08fadbc67dfa3a3e8c723bcf533ae34c7edd0dde2cf3431b9
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /opt/explo/config
      music:
        enabled: true
        path: /media/downloads
        server: ${NFS_HOST}
        type: nfs
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/icon: *app
        hostnames:
          - "{{ .Release.Name }}.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: 7288
