---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app radarr
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      radarr:
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            env:
              RADARR__APP__INSTANCENAME: Radarr
              RADARR__APP__THEME: dark
              RADARR__AUTH__METHOD: External
              RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
              RADARR__LOG__DBENABLED: 'False'
              RADARR__LOG__LEVEL: info
              RADARR__POSTGRES__HOST:
                valueFrom:
                  secretKeyRef:
                    name: &pg "{{ .Release.Name }}-pguser-secret"
                    key: host
              RADARR__POSTGRES__MAINDB: *app
              RADARR__POSTGRES__PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: &pg "{{ .Release.Name }}-pguser-secret"
                    key: password
              RADARR__POSTGRES__PORT: 5432
              RADARR__POSTGRES__USER: *app
              RADARR__UPDATE__BRANCH: develop
              TZ: ${TIMEZONE}
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 6.1.0.10309@sha256:10f94c85f605d42e5e78de928f24758b5750a4e99eee8d0ef9ff150f7a2df033
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      media:
        enabled: true
        path: /media/qbittorrent/downloads
        server: ${NFS_HOST}
        type: nfs
      sabnzbd:
        advancedMounts:
          radarr:
            app:
            - path: /mnt/sabdnzb
        enabled: true
        path: /media/sabnzbd/downloads
        server: ${NFS_HOST}
        type: nfs
      tmpfs:
        type: emptyDir
        advancedMounts:
          radarr:
            app:
            - path: /config/cache
              subPath: cache
            - path: /config/log
              subPath: log
            - path: /tmp
              subPath: tmp
    route:
      app:
        hostnames:
        - '{{ .Release.Name }}.${ROOT_DOMAIN}'
        parentRefs:
        - name: envoy-internal
          namespace: network
    service:
      app:
        ports:
          http:
            port: 7878
