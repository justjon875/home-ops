apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: readarr
  namespace: downloads
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 2.6.0
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        containers:
          main:
            annotations:
              secret.reloader.stakater.com/reload: readarr-secrets
            env:
              PGID: '568'
              PUID: '568'
              READARR__APPLICATION_URL: https://readarr.${ROOT_DOMAIN}
              READARR__INSTANCE_NAME: Readarr
              READARR__LOG_LEVEL: info
              READARR__PORT: 8787
              TZ: ${TIMEZONE}
            image:
              repository: ghcr.io/onedr0p/readarr-develop
              tag: 0.3.22.2499@sha256:53ad18bde065cb73508e67a9e59f3b9361f2aa8f48a42e5f44d14e7fe6d5ee41
            resources:
              limits:
                memory: 224M
              requests:
                cpu: 5m
                memory: 224M
    defaultPodOptions:
      podSecurityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsUser: 568
    ingress:
      main:
        className: nginx
        enabled: true
        hosts:
          - host: &host readarr.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: main
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      config:
        enabled: true
        path: ${NFS_PATH}/arrs/readarr/config
        server: ${NFS_HOST}
        type: nfs
      media:
        enabled: true
        path: ${MEDIA_PATH}/qbittorrent/downloads
        server: ${NFS_HOST}
        type: nfs
      sabnzbd:
        enabled: true
        path: ${MEDIA_PATH}/sabnzbd/downloads
        server: ${NFS_HOST}
        type: nfs
    service:
      main:
        ports:
          http:
            port: 8787
