apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: invidious
  namespace: downloads
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      inv-sig-helper:
        containers:
          app:
            args: ["--tcp", "0.0.0.0:12999"]
            env:
              RUST_LOG: info
            image:
              repository: quay.io/invidious/inv-sig-helper
              tag: latest@sha256:b5466c9add729e82e4e3ee5515c30b69df02d78ebb2486dbc9c63e456f29083d
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
      invidious:
        containers:
          app:
            envFrom:
              - secretRef:
                  name: invidious
            image:
              repository: quay.io/invidious/invidious
              tag: latest@sha256:9ffa4f1ea5cf01abe3102777102bd7a13153c79f6ff6ac072b6a29dda6909a8b
    defaultPodOptions:
      enableServiceLinks: false
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: invidious.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: invidious
                  port: http
        tls:
          - hosts:
              - invidious.${ROOT_DOMAIN}
    service:
      inv-sig-helper:
        controller: inv-sig-helper
        ports:
          http:
            port: 12999
      invidious:
        controller: invidious
        ports:
          http:
            port: 3000
