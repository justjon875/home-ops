apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: invidious
  namespace: downloads
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 3.3.2
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      invidious:
        containers:
          app:
            envFrom:
              - secretRef:
                  name: invidious
            image:
              repository: quay.io/invidious/invidious
              tag: latest@sha256:c8469fc7dd088433261852cf644adcae9a4ce4a1f05f20c2e76da80bb1e09a81
    defaultPodOptions:
      enableServiceLinks: false
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: invidious.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - invidious.${ROOT_DOMAIN}
    service:
      app:
        controller: invidious
        ports:
          http:
            port: 3000
