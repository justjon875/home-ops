apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: invidious
  namespace: downloads
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 3.7.3
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      inv-sig-helper:
        containers:
          app:
            args: ["--tcp", "0.0.0.0:12999"]
            env:
              RUST_LOG: info
            image:
              repository: quay.io/invidious/inv-sig-helper
              tag: latest@sha256:1cfd80c42482f6524a3f7a11fdc0f623b761f8cd6686a4c027aaff05fb853fe5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
      invidious:
        containers:
          app:
            envFrom:
              - secretRef:
                  name: invidious
            image:
              repository: quay.io/invidious/invidious
              tag: latest@sha256:07b54eb82bd7b4d3cf9fe2f1a2cc7dfd18f6e14d23db185c2e34ffb8c21da093
    defaultPodOptions:
      enableServiceLinks: false
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: invidious.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: invidious
                  port: http
        tls:
          - hosts:
              - invidious.${ROOT_DOMAIN}
    service:
      inv-sig-helper:
        controller: inv-sig-helper
        ports:
          http:
            port: 12999
      invidious:
        controller: invidious
        ports:
          http:
            port: 3000
