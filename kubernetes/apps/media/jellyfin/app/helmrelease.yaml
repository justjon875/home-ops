---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellyfin
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      jellyfin:
        containers:
          app:
            env:
              TZ: ${TIMEZONE}
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
            resources:
              requests:
                cpu: 100m
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsUser: 1000
    persistence:
      audio:
        enabled: true
        globalMounts:
          - path: /mnt/audio
        path: ${NFS_PATH}/navidrome/media
        server: ${NFS_HOST}
        type: nfs
      config:
        existingClaim: "{{ .Release.Name }}"
      media:
        enabled: true
        globalMounts:
          - path: /media
        path: /media/qbittorrent/downloads
        server: ${NFS_HOST}
        type: nfs
      metube:
        enabled: true
        globalMounts:
          - path: /mnt/metube
        path: /media/metube
        server: ${NFS_HOST}
        type: nfs
      ytptube:
        enabled: true
        globalMounts:
          - path: /mnt/ytptube
        path: /media/ytptube
        server: ${NFS_HOST}
        type: nfs
      transcodes:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /transcodes
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/icon: *app
          gethomepage.dev/widget.type: jellyfin
          gethomepage.dev/widget.url: https://jellyfin.${ROOT_DOMAIN}
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_JELLYFIN_KEY}}` }}"
        hostnames:
          - "{{ .Release.Name }}.${SHORT_ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: 8096
