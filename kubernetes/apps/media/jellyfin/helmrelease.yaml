apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: media
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 3.1.0
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      jellyfin:
        containers:
          app:
            env:
              - name: NVIDIA_VISIBLE_DEVICES
                value: all
              - name: NVIDIA_DRIVER_CAPABILITIES
                value: all
            image:
              repository: ghcr.io/onedr0p/jellyfin
              tag: 10.8.11@sha256:926e2a9f6677a0c7b12feba29f36c954154869318d6a52df72f72ff9c74cf494
            resources:
              limits:
                memory: 6000Mi
                nvidia.com/gpu: 1
              requests:
                cpu: 100m
                memory: 1000Mi
                nvidia.com/gpu: 1
        initContainers:
          init-permission:
            command:
              - sh
              - -c
              - chown -R 568:568 /transcodes
            image:
              repository: ghcr.io/cbc02009/busybox
              tag: 1.36.1
            securityContext:
              runAsUser: 0
        pod:
          runtimeClassName: nvidia
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 568
            runAsUser: 568
            supplementalGroups:
              - 65539
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: jellyfin.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - jellyfin.${ROOT_DOMAIN}
    persistence:
      audio:
        enabled: true
        globalMounts:
          - path: /mnt/audio
        path: ${NFS_PATH}/navidrome/media
        server: ${NFS_HOST}
        type: nfs
      config:
        enabled: true
        path: ${NFS_PATH}/jellyfin/config
        server: ${NFS_HOST}
        type: nfs
      media:
        enabled: true
        globalMounts:
          - path: /media
        path: /mnt/raid/media/qbittorrent/downloads
        server: ${NFS_HOST}
        type: nfs
      metube:
        enabled: true
        globalMounts:
          - path: /mnt/metube
        path: /mnt/raid/media/metube
        server: ${NFS_HOST}
        type: nfs
      transcodes:
        enabled: true
        type: emptyDir
        globalMounts:
           - path: /transcodes
    service:
      app:
        controller: jellyfin
        ports:
          http:
            port: 8096
