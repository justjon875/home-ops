apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: downloads
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 3.5.1
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      prowlarr:
        containers:
          app:
            env:
              PGID: '568'
              PUID: '568'
              TZ: Asia/Singapore
            image:
              repository: ghcr.io/onedr0p/prowlarr-nightly
              tag: 1.29.0.4897@sha256:8672b6371b8b6c94b6360878e31db820fd5c52db4a444bb63ed0573914c6f771
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsUser: 568
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: prowlarr.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - prowlarr.${ROOT_DOMAIN}
    persistence:
      config:
        enabled: true
        path: ${NFS_PATH}/arrs/prowlarr/config
        server: ${NFS_HOST}
        type: nfs
    service:
      app:
        controller: prowlarr
        ports:
          http:
            port: 9696
