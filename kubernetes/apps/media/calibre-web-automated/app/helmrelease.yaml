apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app calibre-web-automated
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      calibre-web-automated:
        containers:
          app:
            env:
              CACHE_DIR: /config/cache
              PGID: 1000
              PUID: 1000
              TZ: ${TZ}
            image:
              repository: crocodilestick/calibre-web-automated
              tag: V3.0.4
            securityContext:
              allowPrivilegeEscalation: false
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SHORT_ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      calibre-library:
        path: /media/books
        server: ${NFS_HOST}
        type: nfs
    service:
      app:
        ports:
          http:
            port: 8083
