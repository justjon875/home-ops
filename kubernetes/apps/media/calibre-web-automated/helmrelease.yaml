apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre-web-automated
  namespace: media
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      calibre-web-automated:
        containers:
          app:
            env:
              CACHE_DIR: /config/cache
              PGID: 1000
              PUID: 1000
              TZ: ${TZ}
            image:
              repository: crocodilestick/calibre-web-automated
              tag: V3.0.4
            securityContext:
              allowPrivilegeEscalation: false
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: cwa.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - calibre.${ROOT_DOMAIN}
      content-server:
        className: internal
        enabled: true
        hosts:
          - host: calibre-content.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: content-server
                  port: http
        tls:
          - hosts:
              - calibre-content.${ROOT_DOMAIN}
    persistence:
      config:
        path: ${NFS_PATH}/calibre-web-automated/config
        server: ${NFS_HOST}
        type: nfs
      public:
        globalMounts:
          - path: /data
        path: /mnt/raid/media/books
        server: ${NFS_HOST}
        type: nfs
    service:
      app:
        controller: calibre
        ports:
          http:
            port: 8080
      content-server:
        controller: calibre
        ports:
          http:
            port: 8081
