apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyseerr
  namespace: downloads
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 3.6.1
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      jellyseerr:
        containers:
          app:
            image:
              repository: fallenbagel/jellyseerr
              tag: 2.2.3@sha256:a324fa4d81cce73116801bee3c50b632f3457c0ca0ad31aa692c640e22f50dea
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: jellyseerr.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - jellyseerr.${ROOT_DOMAIN}
    persistence:
      config:
        enabled: true
        globalMounts:
          - path: /app/config
        path: ${NFS_PATH}/jellyseerr
        server: ${NFS_HOST}
        type: nfs
    service:
      app:
        controller: jellyseerr
        ports:
          http:
            port: 5055
