apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: jellyseerr
  namespace: downloads
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 3.2.1
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      jellyseerr:
        containers:
          app:
            image:
              repository: fallenbagel/jellyseerr
              tag: 1.9.2@sha256:8812433a7cf3b24e1946141282286e769eac6b6bf4eee35c93cf3c4cd960dbce
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: jellyseerr.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - jellyseerr.${ROOT_DOMAIN}
    persistence:
      config:
        enabled: true
        globalMounts:
          - path: /app/config
        path: ${NFS_PATH}/jellyseerr
        server: ${NFS_HOST}
        type: nfs
    service:
      app:
        controller: jellyseerr
        ports:
          http:
            port: 5055
