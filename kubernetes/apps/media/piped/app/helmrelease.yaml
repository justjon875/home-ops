apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app piped
spec:
  interval: 15m
  chart:
    spec:
      chart: piped
      version: 8.1.25
      sourceRef:
        kind: HelmRepository
        name: teampiped
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    ingress:
      main:
        enabled: false
      backend:
        enabled: false
      ytproxy:
        enabled: false
    postgresql:
      enabled: false
    backend:
      config:
        API_URL: https://piped-api.${ROOT_DOMAIN}
        FRONTEND_URL: https://piped.${ROOT_DOMAIN}
        NUM_WORKERS: 2
        PORT: 8080
        PROXY_PART: https://ytproxy.${ROOT_DOMAIN}
        database:
          connection_url: jdbc:postgresql://${POSTGRESQL_HOST}:5432/piped
          driver_class: org.postgresql.Driver
          dialect: org.hibernate.dialect.PostgreSQLDialect
      image:
        repository: 1337kavin/piped
        tag: latest@sha256:7747e19ee501c0a3afa94dd3d6e982dd4247f1babe03fb515b4a0f0b87f82b2e
    frontend:
      env:
        BACKEND_HOSTNAME: piped-api.${ROOT_DOMAIN}
      image:
        repository: 1337kavin/piped-frontend
        tag: latest@sha256:1ce67163448941627a2abc51a1d622120331d8e55ef78b85a83dc2de8811616e
    ytproxy:
      env:
        RUST_BACKTRACE: 1
      image:
        repository: 1337kavin/piped-proxy
        tag: latest@sha256:09b348b654c1dc5fb710c55cb8d224b879763dac2642cd41f660bad42d034165
  valuesFrom:
    - kind: Secret
      name: *app
      valuesKey: database.password
      targetPath: backend.config.database.password
    - kind: Secret
      name: *app
      valuesKey: database.username
      targetPath: backend.config.database.username
