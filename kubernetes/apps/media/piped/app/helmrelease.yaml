apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app piped
spec:
  interval: 15m
  chart:
    spec:
      chart: piped
      version: 8.0.26
      sourceRef:
        kind: HelmRepository
        name: teampiped
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    postgresql:
      enabled: false
    frontend:
      env:
        BACKEND_HOSTNAME: piped-api.${ROOT_DOMAIN}
      image:
        repository: 1337kavin/piped-frontend
        tag: latest@sha256:d0c4b1e144a50f6782dc00968b884c9e63707db5733b827ec14cbc8f3ab5dd0f
    backend:
      config:
        PORT: 8080
        NUM_WORKERS: 2
        PROXY_PART: https://ytproxy.${ROOT_DOMAIN}
        database:
          connection_url: jdbc:postgresql://${POSTGRESQL_HOST}:5432/piped
          driver_class: org.postgresql.Driver
          dialect: org.hibernate.dialect.PostgreSQLDialect
        image:
          repository: 1337kavin/piped
          tag: latest@sha256:b0462b15a951061878d13abf3e3706b60a33c1941cb28bb48f86227d0fbeb730
    ytproxy:
      image:
        repository: 1337kavin/piped-proxy
        tag: latest@sha256:aad3c0932ed05b0eecc131233129183a44238da83e9838763bc7392ce3a82808
  valuesFrom:
    - kind: Secret
      name: *app
      valuesKey: database.password
      targetPath: backend.config.database.password
    - kind: Secret
      name: *app
      valuesKey: database.username
      targetPath: backend.config.database.username
