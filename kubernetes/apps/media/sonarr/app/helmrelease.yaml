apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sonarr
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      sonarr:
        containers:
          app:
            env:
              PGID: '1000'
              PUID: '1000'
              SONARR__LOG__DBENABLED: 'False'
              SONARR__LOG__LEVEL: info
              TZ: Asia/Singapore
            envFrom:
            - secretRef:
                name: sonarr-secret
            image:
              repository: quay.io/11notes/sonarr
              tag: 4.0.16@sha256:c8f72e7f34015d99f49eaacb31d6cceeb6306960cf5115505bdecb66e2b7c2ec
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    persistence:
      config:
        advancedMounts:
          sonarr:
            app:
            - path: /sonarr/etc
        existingClaim: "{{ .Release.Name }}"
      media:
        enabled: true
        path: /mnt/raid/media/qbittorrent/downloads
        server: ${NFS_HOST}
        type: nfs
      sabnzbd:
        advancedMounts:
          sonarr:
            app:
            - path: /mnt/sabdnzb
        enabled: true
        path: /mnt/raid/media/sabnzbd/downloads
        server: ${NFS_HOST}
        type: nfs
      tmpfs:
        type: emptyDir
        advancedMounts:
          sonarr:
            app:
            - path: /tmp
              subPath: tmp
    route:
      app:
        hostnames:
        - '{{ .Release.Name }}.${SHORT_ROOT_DOMAIN}'
        parentRefs:
        - name: envoy-internal
          namespace: network
    service:
      app:
        controller: sonarr
        ports:
          http:
            port: 8989
