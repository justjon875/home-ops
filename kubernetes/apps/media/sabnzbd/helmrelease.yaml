apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: sabnzbd
  namespace: downloads
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 2.6.0
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        containers:
          main:
            env:
              TZ: ${TIMEZONE}
            image:
              repository: ghcr.io/onedr0p/sabnzbd
              tag: 4.2.3@sha256:b217130f3ddd90bb7e536744772938da5c86cc9b7a08594127ff1bef34e17236
    hostname: qbittorrent
    ingress:
      main:
        className: nginx
        enabled: true
        hosts:
          - host: &host sabnzbd.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: main
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      config:
        enabled: true
        path: /mnt/raid/media/sabnzbd/config
        server: ${NFS_HOST}
        type: nfs
      sabnzbd:
        enabled: true
        path: /mnt/raid/media/sabnzbd/downloads
        server: ${NFS_HOST}
        type: nfs
    service:
      main:
        ports:
          http:
            port: 8080
