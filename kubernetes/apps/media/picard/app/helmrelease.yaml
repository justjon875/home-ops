---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app picard
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      picard:
        containers:
          app:
            image:
              repository: ghcr.io/jlesage/musicbrainz-picard
              tag: v26.07.1@sha256:f481d52d402724325266c79759b495f0796947482fc09011b734028a40c8e4bc
            env:
              TZ: "${TIMEZONE}"
              LANG: "en_US.UTF-8"
              DARK_MODE: "1"
              WEB_AUDIO: "1"
              WEB_LISTENING_PORT: &port 5800 # Default 5800
            resources:
              requests:
                cpu: 10m
                memory: 250Mi
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      media:
        type: nfs
        server: ${NFS_HOST}
        path: ${NFS_PATH}/navidrome/media
        globalMounts:
          - path: /media
            readOnly: true
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/icon: *app
        hostnames:
          - "{{ .Release.Name }}.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port
