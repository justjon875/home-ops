apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: safetwitch
  namespace: media
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 2.3.0
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        containers:
          main:
            env:
              URL: &host '{{ .Release.Name }}.${ROOT_DOMAIN}'
            image:
              repository: codeberg.org/safetwitch/safetwitch-backend
              tag: v1.5.4@sha256:dfa6e182bc5f32d32a7678b54598ebfed35623f496340580630d6a712186c499
      frontend:
        containers:
          main:
            env:
              SAFETWITCH_BACKEND_DOMAIN: *host
              SAFETWITCH_INSTANCE_DOMAIN: *host
              SAFETWITCH_DEFAULT_LOCALE: en
              SAFETWITCH_FALLBACK_LOCALE: en
            image:
              repository: codeberg.org/safetwitch/safetwitch
              tag: v2.4.2@sha256:3c35e83d5d7a1235fe0f507a83f64748b64709690f46215c27a9479c43bdb002
    ingress:
      main:
        className: nginx
        enabled: true
        hosts:
          - host: *host
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: main
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      config:
        enabled: true
        path: ${NFS_PATH}/navidrome/config
        server: ${NFS_HOST}
        type: nfs
      music:
        enabled: true
        path: ${NFS_PATH}/navidrome/media
        server: ${NFS_HOST}
        type: nfs
    service:
      main:
        controller: frontend
        ports:
          http:
            port: 8280
