apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app calibre
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100 # max weight = 100
            preference:
              matchExpressions:
                - key: cpu
                  operator: In
                  values:
                    - high
    controllers:
      calibre:
        containers:
          app:
            env:
              PGID: 1000
              PUID: 1000
              TZ: ${TZ}
            image:
              repository: lscr.io/linuxserver/calibre
              tag: 9.10.0@sha256:210dc050f7473197109fdc76f3809e9295566d68d2737363e60b1fc5fe170398
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      media:
        globalMounts:
          - path: /data
        path: /media/books
        server: ${NFS_HOST}
        type: nfs
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/href: "https://{{ .Release.Name }}.${ROOT_DOMAIN}"
          gethomepage.dev/icon: *app
        hostnames:
          - "{{ .Release.Name }}.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: &port 8080
      content-server:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/href: "https://calibre-content.${ROOT_DOMAIN}"
          gethomepage.dev/group: Media
          gethomepage.dev/icon: *app
        hostnames:
          - calibre-content.${ROOT_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: content-server
                port: &content-server-port 8081
    service:
      app:
        ports:
          http:
            port: *port
      content-server:
        ports:
          http:
            port: *content-server-port
