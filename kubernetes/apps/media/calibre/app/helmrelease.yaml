apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app calibre
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100          # max weight = 100
          preference:
            matchExpressions:
            - key: cpu
              operator: In
              values:
              - high
    controllers:
      calibre:
        containers:
          app:
            env:
              PGID: 1000
              PUID: 1000
              TZ: ${TZ}
            image:
              repository: lscr.io/linuxserver/calibre
              tag: 9.4.0@sha256:b7105b823b81f39bcefdce43d93f371ff890e77380218ca00065e3c5d977051e
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      media:
        globalMounts:
          - path: /data
        path: /media/books
        server: ${NFS_HOST}
        type: nfs
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: &port 8080
      content-server:
        hostnames:
          - calibre-content.${ROOT_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: content-server
                port: &content-server-port 8081
    service:
      app:
        ports:
          http:
            port: *port
      content-server:
        ports:
          http:
            port: *content-server-port
