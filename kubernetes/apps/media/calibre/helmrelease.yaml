apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre
  namespace: media
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      calibre:
        containers:
          app:
            env:
              PGID: 1000
              PUID: 1000
              TZ: ${TZ}
            image:
              repository: lscr.io/linuxserver/calibre
              tag: 8.4.0@sha256:2cccd5b602b4e81057ded490b2e4470392cdb4c4cef473b4400342f013f71af1
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: calibre.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - calibre.${ROOT_DOMAIN}
      content-server:
        className: internal
        enabled: true
        hosts:
          - host: calibre-content.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: content-server
                  port: http
        tls:
          - hosts:
              - calibre-content.${ROOT_DOMAIN}
    persistence:
      config:
        path: ${NFS_PATH}/calibre/config
        server: ${NFS_HOST}
        type: nfs
      media:
        globalMounts:
          - path: /data
        path: /mnt/raid/media/books
        server: ${NFS_HOST}
        type: nfs
    service:
      app:
        controller: calibre
        ports:
          http:
            port: 8080
      content-server:
        controller: calibre
        ports:
          http:
            port: 8081
