apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: calibre
  namespace: media
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 2.3.0
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        containers:
          main:
            env:
              PGID: 1000 
              PUID: 1000 
              TZ: ${TZ}
            image:
              repository: lscr.io/linuxserver/calibre
              tag: 7.1.0@sha256:f15c4bceb66ab7554726ac50630ce8a6d04a50654cf2c4679db8c08cafe14ef4
    ingress:
      content-server:
        className: nginx
        enabled: true
        hosts:
          - host: &host2 calibre-content.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: content-server
                  port: http
        tls:
          - hosts:
              - *host2
      main:
        className: nginx
        enabled: true
        hosts:
          - host: &host calibre.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: main
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      config:
        path: ${NFS_PATH}/calibre/config
        server: ${NFS_HOST}
        type: nfs
      media:
        globalMounts:
          - path: /data
        path: /mnt/raid/media/books
        server: ${NFS_HOST}
        type: nfs
    service:
      content-server:
        controller: main
        ports:
          http:
            port: 8081
      main:
        ports:
          http:
            port: 8080
