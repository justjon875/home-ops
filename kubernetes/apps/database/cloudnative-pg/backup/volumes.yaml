---
apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    pv.kubernetes.io/provisioned-by: nfs.csi.k8s.io
  name: cloudnative-pg-backup-pv-nfs
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-csi
  mountOptions:
    - nfsvers=4.2
  csi:
    driver: nfs.csi.k8s.io
    readOnly: false
    # volumeHandle format: {nfs-server-address}#{sub-dir-name}#{share-name}
    # make sure this value is unique for every share in the cluster
    volumeHandle: "${NFS_HOST}${NFS_PATH}#cloudnative-pg-backup#"
    volumeAttributes:
      server: "${NFS_HOST}"
      share: "${NFS_PATH}/cloudnative-pg-backup"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudnative-pg-backup-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: nfs-csi
  volumeName: cloudnative-pg-backup-pv-nfs
