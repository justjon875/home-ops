# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cloudnative-pg-dev
  namespace: dev
  annotations:
    kyverno.io/ignore: "true"
spec:
  bootstrap:
    recovery:
      source: cloudnative-pg
  instances: 1
  imageName: ghcr.io/bo0tzz/cnpgvecto.rs:16.1-v0.1.11
  primaryUpdateStrategy: unsupervised
  storage:
    size: 10Gi
    storageClass: local-hostpath
  superuserSecret:
    name: cloudnative-pg-superuser
  enableSuperuserAccess: true
  postgresql:
    shared_preload_libraries:
      - "vectors.so"
    parameters:
      max_connections: "600"
      max_slot_wal_keep_size: 10GB
      shared_buffers: 512MB
  resources:
    requests:
      memory: "512Mi"
    limits:
      hugepages-2Mi: "512Mi"
  monitoring:
    enablePodMonitor: true
  externalClusters:
    - name: cloudnative-pg
      barmanObjectStore:
        wal:
          compression: bzip2
          maxParallel: 8
        destinationPath: s3://${S3_POSTGRESQL_BUCKET}/postgres/
        endpointURL: https://${S3_ENDPOINT}
        s3Credentials:
          accessKeyId:
            name: cloudnative-pg-superuser
            key: aws-access-key-id
          secretAccessKey:
            name: cloudnative-pg-superuser
            key: aws-secret-access-key
