# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql16
  namespace: dev
spec:
  bootstrap:
    initdb:
      import:
        type: monolith
        databases:
          - "*"
        roles:
          - "*"
        source:
          externalCluster: postgresql-16
  env:
    - name: TZ
      value: ${TIMEZONE}
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6@sha256:d7822fa6eba284a6d3d035d51a51de22147bc5e72d87aa93e7dd9fa87455ed5c
  primaryUpdateStrategy: unsupervised
  storage:
    size: 10Gi
    storageClass: local-hostpath
  superuserSecret:
    name: cloudnative-pg-superuser
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "250"
      shared_buffers: 128MB
  resources:
    requests:
      memory: "512Mi"
    limits:
      hugepages-2Mi: "512Mi"
  externalClusters:
    - name: postgresql-16
      connectionParameters:
        # Use the correct IP or host name for the source database
        host: postgresql.default
        user: postgres
        dbname: postgres
      password:
        name: cloudnative-pg-superuser
        key: password
  backup:
    barmanObjectStore:
      data:
        compression: bzip2
      wal:
        compression: bzip2
        maxParallel: 8
      destinationPath: s3://${BACKBLAZE_BUCKET}/postgresql-16
      endpointURL: https://${BACKBLAZE_ENDPOINT}
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg-superuser
          key: aws-access-key-id
        secretAccessKey:
          name: cloudnative-pg-superuser
          key: aws-secret-access-key
