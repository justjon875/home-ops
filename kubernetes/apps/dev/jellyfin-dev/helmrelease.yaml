apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin-dev
  namespace: dev
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 3.5.1
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      jellyfin:
        containers:
          app:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 10.10.1
              resources:
          requests:
            cpu: 15m
            memory: 204M
          limits:
            cpu: 49m
            memory: 1399M
            gpu.intel.com/i915: 1
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: &host jellyfin-dev.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      config:
        enabled: true
        path: /mnt/ssd/jellyfin/config
        server: ${NFS_HOST}
        type: nfs
      media:
        enabled: true
        globalMounts:
          - path: /media
        path: /mnt/ssd/jellyfin/media
        server: ${NFS_HOST}
        type: nfs
    service:
      app:
        controller: jellyfin
        ports:
          http:
            port: 8096
