apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql-dev
  namespace: dev
spec:
  interval: 15m
  chart:
    spec:
      chart: postgresql
      version: 15.5.24
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    global:
      postgresql:
        auth:
          postgresPassword: ${POSTGRESQL_PASSWORD}
    image:
      tag: 16.3.0@sha256:865e341baf49006e32b3e72254a15a81c939178cb9c48fcd9faf1c0ac4b49664
    primary:
      persistence:
        enabled: true
        existingClaim: postgresql-dev-pvc
      resources:
        requests:
          cpu: 15m
          memory: 345M
        limits:
          cpu: 1438m
          memory: 3532M
    volumePermissions:
      securityContext:
        runAsUser: 1000
        fsGroup: 0
