apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: postgresql-dev
  namespace: dev
spec:
  interval: 15m
  chart:
    spec:
      chart: postgresql
      version: 15.5.17
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    global:
      postgresql:
        auth:
          postgresPassword: ${POSTGRESQL_PASSWORD}
    image:
      tag: 16.3.0
    primary:
      persistence:
        enabled: true
        existingClaim: postgresql-dev-pvc
    volumePermissions:
      securityContext:
        runAsUser: 1000
        fsGroup: 0
