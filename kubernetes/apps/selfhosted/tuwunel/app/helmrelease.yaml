apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tuwunel
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      tuwunel:
        containers:
          app:
            env:
            - name: TUWUNEL_SERVER_NAME
              value: ${ROOT_DOMAIN}
            - name: TUWUNEL_WELL_KNOWN__CLIENT
              value: https://tuwunel.${ROOT_DOMAIN}
            - name: TUWUNEL_WELL_KNOWN__SERVER
              value: tuwunel.${ROOT_DOMAIN}:443
            - name: TUWUNEL_DATABASE_PATH
              value: /data/db
            - name: TUWUNEL_ADDRESS
              value: 0.0.0.0
            - name: RUST_LOG
              value: debug
            - name: TUWUNEL_ALLOW_FEDERATION
              value: 'false'
            - name: TUWUNEL_ALLOW_REGISTRATION
              value: 'true'
            - name: TUWUNEL_ALLOW_LEGACY_MEDIA
              value: 'false'
            envFrom:
            - secretRef:
                name: tuwunel-secret
            image:
              repository: ghcr.io/matrix-construct/tuwunel
              tag: v1.4.7@sha256:1f384b50a1f87a3839b160d5db4fb157abba92d4b9f8fe683d971b2515a5b8c3
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
    podAnnotations:
      configmap.reloader.stakater.com/reload: tuwunel
    route:
      matrix:
        hostnames:
          - "tuwunel.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /_matrix
            backendRefs:
              - identifier: main
                port: &port 80
      app:
        hostnames:
          - "${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /.well-known/matrix
            backendRefs:
              - identifier: main
                port: *port
    service:
      main:
        ports:
          http:
            port: *port
            protocol: TCP
            targetPort: 8008
