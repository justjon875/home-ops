apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tuwunel
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      tuwunel:
        annotations:
          configmap.reloader.stakater.com/reload: "true"
        containers:
          app:
            env:
            - name: RUST_LOG
              value: debug
            - name: TUWUNEL_ADDRESS
              value: 0.0.0.0
            - name: TUWUNEL_ALLOW_FEDERATION
              value: 'false'
            - name: TUWUNEL_ALLOW_REGISTRATION
              value: 'true'
            - name: TUWUNEL_ALLOW_LEGACY_MEDIA
              value: 'false'
            - name: TUWUNEL_DATABASE_PATH
              value: /data/db
            - name: TUWUNEL_PORT
              value: "8080"
            - name: TUWUNEL_SERVER_NAME
              value: ${ROOT_DOMAIN}
            - name: TUWUNEL_WELL_KNOWN__CLIENT
              value: https://tuwunel.${ROOT_DOMAIN}
            - name: TUWUNEL_WELL_KNOWN__SERVER
              value: tuwunel.${ROOT_DOMAIN}:443
            envFrom:
            - secretRef:
                name: tuwunel-secret
            image:
              repository: ghcr.io/matrix-construct/tuwunel
              tag: v1.4.9@sha256:063ec0bb0b3add63372e086257e1800d667c8f6b467f291a2ae05b011aba563f
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
    service:
      main:
        ports:
          http:
            port: &port 80
            protocol: TCP
            targetPort: 8080
    route:
      matrix:
        annotations: {}
        labels: {}
        hostnames:
          - "tuwunel.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /_matrix
            backendRefs:
              - identifier: main
                port: *port
      app:
        annotations: {}
        labels: {}
        hostnames:
          - "${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /.well-known/matrix
            backendRefs:
              - identifier: main
                port: *port
