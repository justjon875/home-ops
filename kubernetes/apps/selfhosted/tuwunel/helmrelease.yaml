apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tuwunel
  namespace: selfhosted
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
    controllers:
      tuwunel:
        containers:
          app:
            image:
              repository: ghcr.io/matrix-construct/tuwunel
              tag: v1.1.0-release-all-x86_64-linux-gnu@sha256:0ffaa9bd91bb6819a7fbc57b9be79e86925a80cf63a106f35926bbe48b29d55e
            env:
              - name: TUWUNEL_SERVER_NAME
                value: "tuwunel.${ROOT_DOMAIN}"
              - name: TUWUNEL_DATABASE_PATH
                value: "/data/db"
              - name: TUWUNEL_ADDRESS
                value: "0.0.0.0"
              - name: RUST_LOG
                value: "info"
              - name: TUWUNEL_ALLOW_FEDERATION
                value: "false"
              - name: TUWUNEL_ALLOW_REGISTRATION
                value: "true"
              - name: TUWUNEL_ALLOW_LEGACY_MEDIA
                value: "false"
            envFrom:
              - secretRef:
                  name: tuwunel-secret
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: &host tuwunel.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      config:
        enabled: true
        existingClaim: tuwunel-pvc
        globalMounts:
          - path: /data
    podAnnotations:
      configmap.reloader.stakater.com/reload: *app
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8080
