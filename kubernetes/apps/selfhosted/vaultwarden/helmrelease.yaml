apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vaultwarden
  namespace: selfhosted
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 3.3.2
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      vaultwarden:
        containers:
          app:
            env:
              DATA_FOLDER: /data
              DOMAIN: https://vaultwarden.${ROOT_DOMAIN}
              SIGNUPS_ALLOWED: false
              SMTP_FROM: vaultwarden@${ROOT_DOMAIN}
              SMTP_HOST: email-smtp.eu-west-1.amazonaws.com
              SMTP_PORT: 587
              SMTP_SECURITY: starttls
              TZ: ${TIMEZONE}
              WEBSOCKET_ENABLED: true
            envFrom:
              - secretRef:
                  name: *app
            image:
              repository: ghcr.io/dani-garcia/vaultwarden
              tag: 1.31.0@sha256:4e28425bad4bd13568e1779f682ff7e441eca2ecd079bd77cfcba6e4eaf1b999
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: &host '{{ .Release.Name }}.${ROOT_DOMAIN}'
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      config:
        enabled: true
        globalMounts:
          - path: /data
        path: /mnt/raid/nfs/vaultwarden
        server: ${NFS_HOST}
        type: nfs
    service:
      app:
        controller: *app
        ports:
          http:
            port: 80
