apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vaultwarden
  namespace: selfhosted
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      vaultwarden:
        containers:
          app:
            env:
              DATA_FOLDER: /data
              DOMAIN: https://vaultwarden.${SHORT_ROOT_DOMAIN}
              SIGNUPS_ALLOWED: false
              SMTP_FROM: vaultwarden@${SHORT_ROOT_DOMAIN}
              SMTP_HOST: email-smtp.eu-west-1.amazonaws.com
              SMTP_PORT: 587
              SMTP_SECURITY: starttls
              TZ: ${TIMEZONE}
              WEBSOCKET_ENABLED: true
            envFrom:
              - secretRef:
                  name: *app
            image:
              repository: ghcr.io/dani-garcia/vaultwarden
              tag: 1.34.1@sha256:48267ea14d8649b2e553a5fe290c40b5dd94d54e9a24b26ae7134a75a659695f
    persistence:
      config:
        enabled: true
        existingClaim: *app
        globalMounts:
          - path: /data
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SHORT_ROOT_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    service:
      app:
        controller: *app
        ports:
          http:
            port: 80
