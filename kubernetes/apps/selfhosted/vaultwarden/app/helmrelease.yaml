---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vaultwarden
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      vaultwarden:
        containers:
          app:
            env:
              DATA_FOLDER: /data
              DOMAIN: https://vaultwarden.${ROOT_DOMAIN}
              SIGNUPS_ALLOWED: false
              SMTP_FROM: vaultwarden@${ROOT_DOMAIN}
              SMTP_HOST: smtp-relay.${ROOT_DOMAIN}
              TZ: ${TIMEZONE}
              WEBSOCKET_ENABLED: true
            envFrom:
            - secretRef:
                name: vaultwarden
            image:
              repository: ghcr.io/dani-garcia/vaultwarden
              tag: 1.35.7@sha256:9a8eec71f4a52411cc43edc7a50f33e9b6f62b5baca0dd95f0c6e7fd60f1a341
            resources:
              requests:
                cpu: 15m
                memory: 183M
              limits:
                cpu: 15m
                memory: 223M
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: selfhosted
        hostnames:
        - '{{ .Release.Name }}.${ROOT_DOMAIN}'
        parentRefs:
        - name: envoy-internal
          namespace: network
    service:
      app:
        ports:
          http:
            port: 80
