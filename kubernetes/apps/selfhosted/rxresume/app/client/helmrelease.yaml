apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app rxresume-client
  namespace: selfhosted
spec:
  chartRef:
    kind: OCIRepository
    name: rxresume
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      rxresume-client:
        containers:
          app:
            image:
              repository: amruthpillai/reactive-resume
              tag: client-3.7.2@sha256:04b561446fb40852e72ce62fd15340424c73cde86a0df4b6e0b7888bf5e53102
    envFrom:
      - secretRef:
          name: rxresume
    route:
      app:
        hostnames:
          - "rxresume.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        controller: *app
        ports:
          http:
            port: 3000
