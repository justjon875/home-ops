apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rxresume-server
  namespace: selfhosted
spec:
  chartRef:
    kind: OCIRepository
    name: rxresume
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      rxresume-server:
        containers:
          app:
            envFrom:
              - secretRef:
                  name: rxresume
            image:
              repository: amruthpillai/reactive-resume
              tag: server-3.7.2@sha256:5794bfe8729a6660f321b5c3525c7bcd354cc0e80b2bfbc23b566a7aacf055be
    service:
      app:
        controller: rxresume-server
        ports:
          http:
            port: 3100
