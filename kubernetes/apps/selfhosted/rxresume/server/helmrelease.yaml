apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rxresume-server
  namespace: selfhosted
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      rxresume-server:
        containers:
          app:
            envFrom:
              - secretRef:
                  name: rxresume
            image:
              repository: amruthpillai/reactive-resume
              tag: server-3.7.2@sha256:ec5f719a9c57ca218d014665d3fff0c9c46d835543bdc43ccc0d25faf8bdb891
        replicas: 0
    service:
      app:
        controller: rxresume-server
        ports:
          http:
            port: 3100
