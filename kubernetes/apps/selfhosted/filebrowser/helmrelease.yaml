apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app filebrowser
  namespace: selfhosted
spec:
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 3.7.1
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      filebrowser:
        containers:
          app:
            env:
              TZ: ${TZ}
            image:
              repository: ghcr.io/onedr0p/filebrowser
              tag: v2.27.0
            probes:
              liveness: &probes
                custom: true
                enabled: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /health
                    port: 80
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
              readiness: *probes
              startup:
                enabled: false
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: &host '{{ .Release.Name }}.${ROOT_DOMAIN}'
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      config:
        enabled: true
        existingClaim: filebrowser-pvc
      cyberdrop:
        enabled: true
        globalMounts:
          - path: /srv/cyberdrop
        server: ${NFS_HOST}
        type: nfs
      filebrowser:
        enabled: true
        globalMounts:
          - path: /.filebrowser.json
            subPath: filebrowser.json
            readOnly: true
        name: filebrowser-config
        type: configMap
      media:
        enabled: true
        globalMounts:
          - path: /srv/media
        path: ${MEDIA_PATH}
        server: ${NFS_HOST}
        type: nfs
      originals:
        enabled: true
        globalMounts:
          - path: /srv/originals
        server: ${NFS_HOST}
        type: nfs
    resources:
      limits:
        memory: 500Mi
      requests:
        cpu: 10m
        memory: 50Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: 80
  valuesFrom:
    - kind: Secret
      name: *app
      targetPath: persistence.originals.path
      valuesKey: ORIGINALS_PATH
    - kind: Secret
      name: *app
      targetPath: persistence.cyberdrop.path
      valuesKey: CYBERDROP_PATH
