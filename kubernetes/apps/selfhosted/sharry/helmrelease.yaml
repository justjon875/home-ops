apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: &app sharry
  namespace: selfhosted
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 2.5.0
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        containers:
          main:
            annotations:
              configMap.reloader.stakater.com/reload: *app
              secret.reloader.stakater.com/reload: *app
            args:
              - /opt/sharry.conf
            image:
              repository: eikek0/sharry
              tag: v1.13.0@sha256:c63c4be89b5eecf10efdd3b234bd2db91fd054bd9d47fb09af956d9b977f0ee7
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 250Mi
    ingress:
      main:
        className: nginx
        enabled: true
        hosts:
          - host: &host '{{ .Release.Name }}.${ROOT_DOMAIN}'
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: main
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      config-file:
        globalMounts:
          - path: /opt/sharry.conf
            subPath: sharry.conf
        name: *app
        type: configMap
      data:
        path: /mnt/raid/media/sharry
        server: ${NFS_HOST}
        type: nfs
    service:
      main:
        ports:
          http:
            port: 9090
