apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: &app sharry
  namespace: selfhosted
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 3.2.1
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      sharry:
        containers:
          app:
            args:
              - /opt/sharry.conf
            image:
              repository: eikek0/sharry
              tag: v1.14.0@sha256:47662c686449772de1ae6cc801d94c135a4ecf4947e182ad9c1e6c585e800688
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 250Mi
    ingress:
      main:
        className: internal
        enabled: true
        hosts:
          - host: &host '{{ .Release.Name }}.${ROOT_DOMAIN}'
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      config-file:
        globalMounts:
          - path: /opt/sharry.conf
            subPath: sharry.conf
        name: *app
        type: configMap
      data:
        path: /mnt/raid/media/sharry
        server: ${NFS_HOST}
        type: nfs
    podAnnotations:
      configmap.reloader.stakater.com/reload: *app
      secret.reloader.stakater.com/reload: *app
    service:
      app:
        controller: *app
        ports:
          http:
            port: 9090
