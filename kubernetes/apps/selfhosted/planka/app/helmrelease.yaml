apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app planka
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      planka:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            envFrom:
            - secretRef:
                name: *app
            image:
              repository: ghcr.io/plankanban/planka
              tag: 1.26.3@sha256:e469d724985db3f560ef0aa2218d54536212459bf8ecbdbc9fd995fc3cbe29db
    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          planka:
            app:
            - path: /app/public/user-avatars
              subPath: user-avatars
            - path: /app/private/attachments
              subPath: attachments
            - path: /app/public/project-background-images
              subPath: project-background-images
    route:
      app:
        hostnames:
        - '{{ .Release.Name }}.${ROOT_DOMAIN}'
        parentRefs:
        - name: envoy-internal
          namespace: network
    service:
      app:
        controller: *app
        ports:
          http:
            port: 1337
