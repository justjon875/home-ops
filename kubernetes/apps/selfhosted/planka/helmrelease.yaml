apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: planka
  namespace: selfhosted
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 2.3.0
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        containers:
          main:
            envFrom:
              - secretRef:
                  name: planka
            image:
              repository: ghcr.io/plankanban/planka
              tag: 1.15.2@sha256:7d4facab07e97ab49d6d9b08ef9178de3d375737d3882210f3dca1df055b6544
    ingress:
      main:
        className: nginx
        enabled: true
        hosts:
          - host: &host '{{ .Release.Name }}.${ROOT_DOMAIN}'
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: main
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      data:
        accessMode: ReadWriteOnce
        enabled: true
        existingClaim: planka-pvc
        size: 10Gi
        subPath:
          - mountPath: /app/public/user-avatars
            path: user-avatars
          - mountPath: /app/private/attachments
            path: attachments
          - mountPath: /app/public/project-background-images
            path: project-background-images
    service:
      main:
        ports:
          http:
            port: 1337
