apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app websurfx
  namespace: selfhosted
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      websurfx:
        containers:
          app:
            image:
              repository: neonmmd/websurfx
              tag: redis
    ingress:
      app:
        annotations:
        className: internal
        enabled: true
        hosts:
          - host: &host websurfx.$\{SHORT_ROOT_DOMAIN\}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      config-file:
        globalMounts:
          - path: /etc/xdg/websurfx/config.lua
            readOnly: true
            subPath: config.lua
        name: *app
        type: configMap
    podAnnotations:
      configmap.reloader.stakater.com/reload: *app
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8080
