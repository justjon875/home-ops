apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app stump
  namespace: selfhosted
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      stump:
        containers:
          app:
            env:
              PGID: 1000
              PUID: 1000
              STUMP_PORT: 10801
            image:
              pullPolicy: IfNotPresent
              repository: aaronleopold/stump
              tag: nightly@sha256:69ec2025939dbd7bbb6b619fe032725693f60208ec764101f47d1bde9929ead7
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: &host stump.$\{SHORT_ROOT_DOMAIN\}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      config:
        enabled: true
        path: ${NFS_PATH}/stump
        server: ${NFS_HOST}
        type: nfs
      data:
        enabled: true
        path: ${MEDIA_PATH}/books
        server: ${NFS_HOST}
        type: nfs
    service:
      app:
        controller: *app
        ports:
          http:
            port: 10801
