apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: &app stump
  namespace: selfhosted
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 3.2.1
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      stump:
        containers:
          app:
            env:
              PGID: 1000
              PUID: 1000
              STUMP_PORT: 10801
            image:
              pullPolicy: IfNotPresent
              repository: aaronleopold/stump
              tag: nightly@sha256:ba20f56a5d41adda92ad69614ffefcef60153d5c459655e834c0d6d6bd9d6a6e
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: &host stump.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      config:
        enabled: true
        path: ${NFS_PATH}/stump
        server: ${NFS_HOST}
        type: nfs
      data:
        enabled: true
        path: ${MEDIA_PATH}/books
        server: ${NFS_HOST}
        type: nfs
    service:
      app:
        controller: *app
        ports:
          http:
            port: 10801
