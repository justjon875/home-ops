apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pairdrop
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      pairdrop:
        containers:
          app:
            env:
              DEBUG_MODE: true
              TZ: ${TIMEZONE}
            image:
              repository: lscr.io/linuxserver/pairdrop
              tag: 1.11.2@sha256:1f3a4a1ddb7ccc290f1abdabc2eef2600c97bfdae2d9cefa04d52c391cb09e30
    persistence:
      cache:
        type: emptyDir
        globalMounts:
        - path: /root/.npm/_cacache
      logs:
        type: emptyDir
        globalMounts:
        - path: /root/.npm/_logs
    route:
      app:
        hostnames:
        - '{{ .Release.Name }}.${ROOT_DOMAIN}'
        parentRefs:
        - name: envoy-internal
          namespace: network
    service:
      app:
        ports:
          http:
            port: 3000
