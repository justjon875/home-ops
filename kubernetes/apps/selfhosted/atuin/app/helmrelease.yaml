apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app atuin
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      atuin:
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            args:
            - server
            - start
            env:
              ATUIN_HOST: 0.0.0.0
              ATUIN_METRICS__ENABLE: 'true'
              ATUIN_METRICS__HOST: 0.0.0.0
              ATUIN_METRICS__PORT: 8080
              ATUIN_OPEN_REGISTRATION: 'true'
              ATUIN_PORT: 80
              ATUIN_TLS__ENABLE: 'false'
            envFrom:
            - secretRef:
                name: atuin-secret
            image:
              repository: ghcr.io/atuinsh/atuin
              tag: v18.10.0@sha256:4a29feda6f352581ece849807445fe1f50f2074b4643b7bfe62b27e23705b068
            resources:
              requests:
                cpu: 15m
                memory: 42M
              limits:
                cpu: 15m
                memory: 42M
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
    persistence:
      config:
        enabled: true
        type: emptyDir
    route:
      app:
        hostnames:
        - '{{ .Release.Name }}.${ROOT_DOMAIN}'
        parentRefs:
        - name: envoy-internal
          namespace: network
    service:
      app:
        ports:
          http:
            port: 80
          metrics:
            port: 8080
    serviceMonitor:
      app:
        enabled: true
        endpoints:
        - interval: 1m
          path: /metrics
          port: metrics
          scheme: http
          scrapeTimeout: 10s
        serviceName: atuin
