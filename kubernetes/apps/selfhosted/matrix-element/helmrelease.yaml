apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app matrix-element
  namespace: selfhosted
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 3.5.0
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      matrix-element:
        containers:
          app:
            image:
              repository: vectorim/element-web
              tag: v1.11.81
    global:
      nameOverride: *app
    ingress:
      app:
        annotations:
          nginx.ingress.kubernetes.io/configuration-snippet: |
            add_header X-Frame-Options SAMEORIGIN;
            add_header X-Content-Type-Options nosniff;
            add_header X-XSS-Protection "1; mode=block";
            add_header Content-Security-Policy "frame-ancestors 'none'";
        className: internal
        enabled: true
        hosts:
          - host: &host element.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      config-file:
        globalMounts:
          - path: /app/config.json
            readOnly: true
            subPath: config.json
        name: matrix-element
        type: configMap
    podAnnotations:
      configmap.reloader.stakater.com/reload: *app
    service:
      app:
        controller: *app
        ports:
          http:
            port: 80
