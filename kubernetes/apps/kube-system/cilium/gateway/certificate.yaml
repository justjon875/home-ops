---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: &name "${SHORT_ROOT_DOMAIN/./-}-tls"
  namespace: cert-manager
spec:
  secretName: *name
  issuerRef:
    name: letsencrypt-prod-clusterissuer
    kind: ClusterIssuer
  commonName: ${ROOT_DOMAIN}
  dnsNames:
    - ${ROOT_DOMAIN}
    - "*.${ROOT_DOMAIN}"
