---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app nats-opencloud
spec:
  targetNamespace: cloud
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  path: "./kubernetes/apps/cloud/nats-opencloud/app"
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      - name: cluster-settings
        kind: ConfigMap
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
