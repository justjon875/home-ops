---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opencloud
  namespace: cloud
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: opencloud
    namespace: flux-system
  values:
    # Global settings that apply across components
    global:
      # Domain settings for various services
      domain:
        collabora: collabora.${ROOT_DOMAIN}
        companion: companion.${ROOT_DOMAIN}
        keycloak: pocket-id.${ROOT_DOMAIN}
        opencloud: opencloud.${ROOT_DOMAIN}
        wopi: wopiserver.${ROOT_DOMAIN}
      oidc:
        issuer: https://pocket-id.${ROOT_DOMAIN}
        clientId: "web"
    keycloak:
      internal:
        enabled: false
    postgres:
      enabled: false
    collabora:
      enabled: true
      ssl:
        enabled: false
        verification: false
    onlyoffice:
      enabled: false
    image:
      # OpenCloud image registry
      registry: quay.io
      # OpenCloud image repository
      repository: opencloudeu/opencloud-rolling
      # OpenCloud image tag
      tag: 3.7.0@sha256:7bd41ba329a29869227804875f62cb59f23ed9178ae3b6be36f3a7f0e514077e
    opencloud:
      enabled: true
      logLevel: debug
      logColor: true
      logPretty: true
      persistence:
        config:
          enabled: true
          existingClaim: "opencloud-config-pvc"
        data:
          enabled: true
          existingClaim: "opencloud-pvc"
      storage:
        s3:
          internal:
            enabled: false
          external:
            enabled: true
            endpoint: https://s3.${ROOT_DOMAIN}
            existingSecret: opencloud-secret
            bucket: opencloud
            createBucket: false
      posixfs:
        persistence:
          enabled: false
          existingClaim: opencloud-posixfs-pvc
    ingress:
      enabled: true
      ingressClassName: internal

