apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: collabora
  namespace: cloud
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 3.6.1
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      collabora:
        containers:
          app:
            env:
              extra_params: --o:ssl.termination=true --o:ssl.enable=false
            image:
              repository: collabora/code
              tag: 24.04.11.2.1@sha256:1cf62aa5db7f7e94d0b286f5acdd2ff823f1ef87fedffef1f487abcec5d30e9a
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: collabora.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - collabora.${ROOT_DOMAIN}
    service:
      app:
        controller: collabora
        ports:
          http:
            port: 9980
