apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: collabora
  namespace: cloud
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 2.4.0
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        containers:
          main:
            env:
              extra_params: --o:ssl.termination=true --o:ssl.enable=false
            image:
              repository: collabora/code
              tag: 23.05.6.5.1@sha256:d4f660986b8847c2abb7edd68bc6667e06c190ea246d510a447d4a730be0b8f1
    ingress:
      main:
        className: nginx
        enabled: true
        hosts:
          - host: &host collabora.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: main
                  port: http
        tls:
          - hosts:
              - *host
    service:
      main:
        ports:
          http:
            port: 9980
