apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: collabora
  namespace: cloud
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      collabora:
        containers:
          app:
            env:
              extra_params: --o:ssl.termination=true --o:ssl.enable=false
            image:
              repository: collabora/code
              tag: 25.04.3.1.1@sha256:494ea00ed33e4149698e8995a1fb101400f581810fb86a864dc671a734fdb666
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: collabora.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - collabora.${ROOT_DOMAIN}
    service:
      app:
        controller: collabora
        ports:
          http:
            port: 9980
