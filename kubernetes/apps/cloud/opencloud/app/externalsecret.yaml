# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencloud
spec:
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: opencloud-secret
    template:
      data:
        COLLABORA_ADMIN_USER: admin
        COLLABORA_ADMIN_PASS: "{{ .COLLABORA_ADMIN_PASS }}"
        STORAGE_USERS_DECOMPOSEDS3_ACCESS_KEY: "{{ .ACCESS_KEY }}"
        STORAGE_USERS_DECOMPOSEDS3_BUCKET: opencloud
        STORAGE_USERS_DECOMPOSEDS3_ENDPOINT: https://s3.${ROOT_DOMAIN}
        STORAGE_USERS_DECOMPOSEDS3_REGION: us-east-1
        STORAGE_USERS_DECOMPOSEDS3_SECRET_KEY: "{{ .SECRET_KEY }} "
        NOTIFICATIONS_SMTP_HOST: smtp-relay.utilities.svc.cluster.local
        NOTIFICATIONS_SMTP_PORT: 25
        NOTIFICATIONS_SMTP_SENDER: no-reply@opencloud.${ROOT_DOMAIN}
        NOTIFICATIONS_SMTP_INSECURE: true
  dataFrom:
    - extract:
        key: opencloud
