# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencloud
spec:
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: opencloud-secret
    template:
      data:
        DECOMPOSEDS3_ENDPOINT: https://s3.habjam.xyz
        DECOMPOSEDS3_REGION: us-east-1
        DECOMPOSEDS3_ACCESS_KEY: "{{ .ACCESS_KEY }}"
        DECOMPOSEDS3_SECRET_KEY: "{{ .SECRET_KEY }} "
        DECOMPOSEDS3_BUCKET: opencloud
  dataFrom:
    - extract:
        key: opencloud
