---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opencloud
  namespace: cloud
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      opencloud:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups:
              - 65542 # gladius:external-services
        containers:
          opencloud:
            image:
              repository: quay.io/opencloudeu/opencloud
              tag: 2.1.2@sha256:0972f604d600359d5836d271407d59e713ecc2072966c7340bf679de268f71d0
            env:
              NOTIFICATIONS_SMTP_HOST: email-smtp.eu-west-1.amazonaws.com
              NOTIFICATIONS_SMTP_PORT: 587
              NOTIFICATIONS_SMTP_SENDER: "OpenCloud notifications <opencloud@opencloud.$\{SHORT_ROOT_DOMAIN\}>"
              NOTIFICATIONS_SMTP_AUTHENTICATION: "auto"
              NOTIFICATIONS_SMTP_ENCRYPTION: "starttls"
              OC_ADD_RUN_SERVICES: "notifications"
              OC_LOG_COLOR: true
              OC_LOG_LEVEL: info
              OC_LOG_PRETTY: true
              OC_URL: https://opencloud.$\{SHORT_ROOT_DOMAIN\}
              PROXY_CSP_CONFIG_FILE_LOCATION: /etc/opencloud/csp.yaml
              PROXY_TLS: false
              # Authelia OIDC
              # Auto role assignment:
              # docs: https://doc.owncloud.com/ocis/next/deployment/services/s-list/proxy.html#automatic-role-assignments
              OC_EXCLUDE_RUN_SERVICES: "idp"
              OC_OIDC_ISSUER: https://auth.$\{SHORT_ROOT_DOMAIN\}
              PROXY_AUTOPROVISION_ACCOUNTS: true
              PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD: none
              PROXY_OIDC_REWRITE_WELLKNOWN: true
              PROXY_ROLE_ASSIGNMENT_DRIVER: oidc
              PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: groups
              PROXY_USER_OIDC_CLAIM: "preferred_username"
              PROXY_USER_CS3_CLAIM: "username"
              WEB_OIDC_CLIENT_ID: opencloud-web
              WEB_OIDC_METADATA_URL: https://auth.$\{SHORT_ROOT_DOMAIN\}/.well-known/openid-configuration
              WEB_OIDC_SCOPE: "openid profile email groups"
            envFrom:
              - secretRef:
                  name: opencloud-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1024Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        initContainers:
          init-config:
            image:
              repository: quay.io/opencloudeu/opencloud
              tag: 2.1.2@sha256:0972f604d600359d5836d271407d59e713ecc2072966c7340bf679de268f71d0
            command:
              - /bin/sh
              - -c
            args:
              - |
                if [ ! -f /etc/opencloud/opencloud.yaml ]; then opencloud init; else exit 0; fi
            env:
              OC_INSECURE: true

    ingress:
      app:
        className: internal
        annotations:
          external-dns.alpha.kubernetes.io/target: "internal.$\{SHORT_ROOT_DOMAIN\}"
        hosts:
          - host: opencloud.$\{SHORT_ROOT_DOMAIN\}
            paths:
              - path: /
                service:
                  identifier: app
                  port: &port 9200
    persistence:
      csp:
        type: configMap
        name: opencloud-csp-configmap
        globalMounts:
          - path: /etc/opencloud/csp.yaml
            subPath: csp.yaml
            readOnly: true
      config:
        type: configMap
        name: opencloud-proxy-configmap
        globalMounts:
          - path: /etc/opencloud/proxy.yaml
            subPath: proxy.yaml
            readOnly: true
      data:
        existingClaim: opencloud-pvc
        globalMounts:
          - path: /var/lib/opencloud
            subPath: data
          - path: /etc/opencloud
            subPath: config
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
    service:
      app:
        controller: opencloud
        ports:
          http:
            port: *port
            primary: true
          metrics:
            port: 9205
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: metrics
