---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloud
resources:
  - ./helmrelease.yaml
  - ./secret.sops.yaml
  - ./volumes.yaml

configMapGenerator:
  - name: opencloud-csp-configmap
    files:
      - proxy.yaml=./config/csp.yaml
  - name: opencloud-proxy-configmap
    files:
      - proxy.yaml=./config/proxy.yaml
generatorOptions:
  disableNameSuffixHash: true
