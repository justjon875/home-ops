---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kite
  namespace: utilities
spec:
  interval: 1h
  chart:
    spec:
      chart: kite
      version: 0.7.2
      sourceRef:
        kind: HelmRepository
        name: kite
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
    httpRoutes:
      - name: kite
        hostnames: ["{{ .Release.Name }}.${SHORT_ROOT_DOMAIN}"]
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    secret:
      create: false
      existingSecret: kite-secret
