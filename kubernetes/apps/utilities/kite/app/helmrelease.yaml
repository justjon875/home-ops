---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kite
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100          # max weight = 100
          preference:
            matchExpressions:
            - key: cpu
              operator: In
              values:
              - high
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-initdb-secret"
        containers:
          app:
            image:
              repository: ghcr.io/zxh326/kite
              tag: v0.7.6@sha256:3ab28b9ee983e733e8bfce186a7d90b3252831f632e022be085b0fdf44f074d6
            env:
              HOST: https://{{ .Release.Name }}.${ROOT_DOMAIN}
              # ENABLE_ANALYTICS: true
              DB_TYPE: postgres
              DB_DSN:
                valueFrom:
                  secretKeyRef:
                    name: &pg "{{ .Release.Name }}-pguser-secret"
                    key: dsn
              DEBUG: true
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            # probes:
            #   liveness: &probes
            #     enabled: true
            #     custom: true
            #     spec:
            #       httpGet:
            #         path: ${GATUS_PATH}
            #         port: &port 8080
            #       initialDelaySeconds: 0
            #       periodSeconds: 10
            #       timeoutSeconds: 1
            #       failureThreshold: 3
            #   readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        serviceAccount:
          identifier: *app
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${ROOT_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: &port 8080
    persistence:
      config:
        type: emptyDir
    rbac:
      roles:
        kite:
          type: ClusterRole
          rules:
            - apiGroups: ["*"]
              resources: ["*"]
              verbs: ["*"]
            - nonResourceURLs: ["*"]
              verbs: ["*"]
      bindings:
        kite:
          type: ClusterRoleBinding
          roleRef:
            identifier: kite
          subjects:
            - identifier: kite
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    serviceAccount:
      *app : {}
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: http
