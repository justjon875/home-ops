---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app databasus
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      databasus:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: databasus/databasus
              tag: v2.16.3@sha256:0c17209626b0a24b9c20cfa6155979fa9631f96edced0c62f7fe9742cb26cb9e
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            type: statefulset
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        enabled: false
        controller: *app
    persistence:
      databasus-data:
        existingClaim: *app
