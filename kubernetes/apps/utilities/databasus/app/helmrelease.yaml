---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app databasus
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      databasus:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-chmod-data:
            image:
              repository: busybox
              tag: 1.37
            command: ["sh", "-c", "chmod -R 700 /databasus-data"]
        containers:
          app:
            image:
              repository: databasus/databasus
              tag: v3.32.1@sha256:12a7d5c04271216a3f11ad496021557b5d100177a243fb87b003cc014fe6bd7d
            securityContext:
              readOnlyRootFilesystem: false
              capabilities:
                add:
                  - CHOWN
        type: statefulset
    persistence:
      databasus-data:
        existingClaim: *app
    route:
      app:
        hostnames:
        - '{{ .Release.Name }}.${ROOT_DOMAIN}'
        parentRefs:
        - name: envoy-internal
          namespace: network
    service:
      app:
        ports:
          http:
            port: 4005
