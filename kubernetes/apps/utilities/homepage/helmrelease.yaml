# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: utilities
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    config:
      useExistingConfigMap: homepage-config
    # This enables the service account to access the necessary resources
    enableRbac: true
    env:
      TZ: ${TIMEZONE}
      LOG_LEVEL: debug
    image:
      repository: ghcr.io/gethomepage/homepage
      tag: v1.1.1@sha256:be49a60307fcce7909acdaf2f3b2f3d168a0468d62869bf72d380625dde91fb9
    ingress:
      main:
        enabled: true
        className: internal
        hosts:
          - host: &host home.${ROOT_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    podAnnotations:
      configmap.reloader.stakater.com/reload: "homepage-config"
    resources:
      requests:
        cpu: 15m
        memory: 273M
    # The service account is necessary to allow discovery of other services
    serviceAccount:
      create: true
      name: homepage
    persistence:
      images:
        enabled: true
        globalMounts:
          - path: /app/public/images
        path: ${NFS_PATH}/homepage/images
        server: ${NFS_HOST}
        type: nfs
      logos:
        enabled: true
        globalMounts:
          - path: /app/public/icons
        path: ${NFS_PATH}/homepage/icons
        server: ${NFS_HOST}
        type: nfs
