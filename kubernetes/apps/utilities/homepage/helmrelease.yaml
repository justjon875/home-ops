---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: utilities
spec:
  interval: 15m
  chart:
    spec:
      chart: homepage
      version: 2.0.1
      sourceRef:
        kind: HelmRepository
        name: homepage
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    config:
      useExistingConfigMap: homepage-config
    # This enables the service account to access the necessary resources
    enableRbac: true
    env:
      TZ: ${TIMEZONE}
      LOG_LEVEL: debug
    image:
      repository: ghcr.io/gethomepage/homepage
      tag: v0.10.6@sha256:426d75031d40a47d58b962766a4d11277490973c137ff5a98e051c9d204f5268
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: &host home.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - *host
    podAnnotations:
      configmap.reloader.stakater.com/reload: "homepage-config"
    resources:
      requests:
        cpu: 15m
        memory: 273M
    # The service account is necessary to allow discovery of other services
    serviceAccount:
      create: true
      name: homepage
    persistence:
      images:
        enabled: true
        mountPath: /app/public/images
        path: ${NFS_PATH}/homepage/images
        server: ${NFS_HOST}
        type: nfs
      logos:
        enabled: true
        mountPath: /app/public/icons
        path: ${NFS_PATH}/homepage/icons
        server: ${NFS_HOST}
        type: nfs
