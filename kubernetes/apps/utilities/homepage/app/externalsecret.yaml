---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: homepage-secret
    template:
      data:
        HOMEPAGE_VAR_KOMODO_KEY:      "{{ .KOMODO_KEY }}"
        HOMEPAGE_VAR_KOMODO_SECRET:   "{{ .KOMODO_SECRET }}"
        HOMEPAGE_VAR_IMMICH_SECRET:   "{{ .IMMICH_SECRET }}"
        HOMEPAGE_VAR_RADARR_API_KEY:  "{{ .RADARR_API_KEY }}"
        HOMEPAGE_VAR_SONARR_API_KEY:  "{{ .SONARR_API_KEY }}"
  dataFrom:
    - extract:
        key: komodo
    - extract:
        key: immich
    - extract:
        key: radarr
    - extract:
        key: sonarr
