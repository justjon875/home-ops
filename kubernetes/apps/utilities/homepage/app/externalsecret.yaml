---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: homepage-secret
    template:
      data:
        HOMEPAGE_VAR_KOMODO_KEY: "{{ .KOMODO_KEY }}"
        HOMEPAGE_VAR_KOMODO_SECRET: "{{ .KOMODO_SECRET }}"
        HOMEPAGE_VAR_IMMICH_KEY: "{{ .IMMICH_KEY }}"
        HOMEPAGE_VAR_JELLYFIN_KEY: "{{ .JELLYFIN_KEY }}"
        HOMEPAGE_VAR_SEERR_KEY: "{{ .SEERR_KEY }}"
        HOMEPAGE_VAR_NAVIDROME_SALT: "{{ .NAVIDROME_SALT}}"
        HOMEPAGE_VAR_NAVIDROME_TOKEN: "{{ .NAVIDROME_TOKEN }}"
        HOMEPAGE_VAR_PROWLARR_API_KEY: "{{ .PROWLARR_API_KEY }}"
        HOMEPAGE_VAR_OMV_PASSWORD: "{{ .OMV_PASSWORD }}"
        HOMEPAGE_VAR_OMV_USERNAME: "{{ .OMV_USERNAME }}"
        HOMEPAGE_VAR_RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        HOMEPAGE_VAR_SABNZBD__API_KEY: "{{ .SABNZBD__API_KEY }}"
        HOMEPAGE_VAR_SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        HOMEPAGE_VAR_OPNSENSE_PASSWORD: "{{ .OPNSENSE_PASSWORD }}"
        HOMEPAGE_VAR_OPNSENSE_USERNAME: "{{ .OPNSENSE_USERNAME }}"
        HOMEPAGE_VAR_PIHOLE_PASSWORD: "{{ .PIHOLE_PASSWORD }}"
        HOMEPAGE_VAR_PROXMOX_HYDROGEN: "{{ .PROXMOX_HYDROGEN }}"
        HOMEPAGE_VAR_PROXMOX_IRON: "{{ .PROXMOX_IRON }}"
        HOMEPAGE_VAR_PROXMOX_NEON: "{{ .PROXMOX_NEON }}"
        HOMEPAGE_VAR_PROXMOX_USERNAME: "{{ .PROXMOX_USERNAME }}"
  dataFrom:
    - extract:
        key: komodo
    - extract:
        key: immich
    - extract:
        key: jellyfin
    - extract:
        key: seerr
    - extract:
        key: navidrome
    - extract:
        key: opnsense
    - extract:
        key: openmediavault
    - extract:
        key: pihole-dns
    - extract:
        key: prowlarr
    - extract:
        key: proxmox
    - extract:
        key: radarr
    - extract:
        key: sabnzbd
    - extract:
        key: sonarr
