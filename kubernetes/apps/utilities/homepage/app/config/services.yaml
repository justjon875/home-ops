# yamllint disable
---
- Cluster:
    - Cluster:
        icon: talos.png
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
          refreshInterval: 10000 # in milliseconds
          metrics:
            - label: Cluster Age
              query: round((time() - min(kube_node_created) ) / 86400)
              format:
                type: number
                suffix: d
            - label: Cluster Memory Usage
              query: round(avg(instance:node_memory_utilisation:ratio) * 100, 0.1)
              format:
                type: number
                suffix: "%"
            - label: Cluster CPU Usage
              query: round(avg(instance:node_cpu_utilisation:rate5m) * 100, 0.1)
              format:
                type: number
                suffix: "%"
            - label: Running Pods
              query: sum(kube_pod_status_phase{phase="Running"})
              format:
                type: number
            - label: Available Nodes
              query: count(count by (node) (kube_node_status_condition{condition="Ready"}))
              format:
                type: number
    - OPNSense:
        href: https://oxygen.${OLD_DOMAIN}
        icon: sh-opnsense.svg
        widget:
          type: opnsense
          url: https://oxygen.${OLD_DOMAIN}
          username: {{HOMEPAGE_VAR_OPNSENSE_USERNAME}}
          password: {{HOMEPAGE_VAR_OPNSENSE_PASSWORD}}
- Virtualisation:
    - Hydrogen:
        href: https://hydrogen.${ROOT_DOMAIN}
        icon: sh-proxmox.svg
        widget:
          type: proxmox
          url: https://hydrogen.${ROOT_DOMAIN}
          username: {{HOMEPAGE_VAR_PROXMOX_USERNAME}}
          password: {{HOMEPAGE_VAR_PROXMOX_HYDROGEN}}
          node: hydrogen
    - Iron:
        href: https://iron.${ROOT_DOMAIN}
        icon: sh-proxmox.svg
        widget:
          type: proxmox
          url: https://iron.${ROOT_DOMAIN}
          username: {{HOMEPAGE_VAR_PROXMOX_USERNAME}}
          password: {{HOMEPAGE_VAR_PROXMOX_IRON}}
          node: iron
    - Neon:
        href: https://neon.${ROOT_DOMAIN}
        icon: sh-proxmox.svg
        widget:
          type: proxmox
          url: https://neon.${ROOT_DOMAIN}
          username: {{HOMEPAGE_VAR_PROXMOX_USERNAME}}
          password: {{HOMEPAGE_VAR_PROXMOX_NEON}}
          node: neon
- Storage:
    - Cobalt:
        href: https://cobalt.${ROOT_DOMAIN}
        icon: sh-openmediavault.svg
        widget:
          type: openmediavault
          url: https://cobalt.${ROOT_DOMAIN}
          username: {{HOMEPAGE_VAR_OMV_USERNAME}}
          password: {{HOMEPAGE_VAR_OMV_PASSWORD}}
          method: services.getStatus # required
- Lithium:
    - Dozzle lithium:
        href: https://dozzle.lithium.${OLD_DOMAIN}
        icon: sh-dozzle.svg
    - Forgejo lithium:
        href: https://forgejo.lithium.${OLD_DOMAIN}
        icon: sh-forgejo.svg
    - Pocket-ID:
        href: https://pocketid.lithium.${OLD_DOMAIN}
        icon: sh-pocket-id.svg
    - Dockhand:
        href: https://dockhand.lithium.${OLD_DOMAIN}
        icon: sh-dockhand.svg
    - PiHole:
        href: https://pihole.lithium.${OLD_DOMAIN}
        icon: sh-pi-hole.svg
        widget:
          type: pihole
          url: https://pihole.lithium.${OLD_DOMAIN}
          version: 6 # required if running v6 or higher, defaults to 5
          key: {{HOMEPAGE_VAR_PIHOLE_PASSWORD}}
    - Unifi:
        href: https://unifi.lithium.${OLD_DOMAIN}
        icon: sh-ubiquiti-unifi.svg
    - Whoogle lithium:
        href: https://whoogle.lithium.${OLD_DOMAIN}
        icon: sh-whoogle.png
