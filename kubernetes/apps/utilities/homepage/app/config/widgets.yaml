---
- kubernetes:
    cluster:
      show: true
      cpu: true
      memory: true
      showLabel: true
      label: "cluster"
    nodes:
      show: true
      cpu: true
      memory: true
      showLabel: true
- resources:
    backend: kubernetes
    expanded: true
    cpu: true
    memory: true
    label: "hydrogen"
- openmeteo:
    label: Home # optional
    latitude: ${SECRET_LATITUDE}
    longitude: ${SECRET_LONGITUDE}
    units: metric # or metric
    cache: 5 # Time in minutes to cache API responses, to stay within limits
