---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app busybox
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      busybox:
        containers:
          app:
            image:
              repository: docker.io/library/busybox
              tag: latest
            securityContext:
              privileged: true
              capabilities: { drop: ["ALL"] }
                  defaultPodOptions:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0

    service:
      app:
        enabled: false
        controller: *app
    persistence:
      config:
        existingClaim: *app
