---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app busybox
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      busybox:
        containers:
          app:
            command:
              - sleep
              - "3600"
            image:
              repository: postgres:18
              tag: latest
    service:
      app:
        enabled: false
        controller: *app
    persistence:
      data:
        type: nfs
        server: ${NFS_HOST}
        path: ${NFS_PATH}/cloudnative-pg-backup
        globalMounts:
          - path: /mnt/data
            readOnly: true
