---
httpRoute:
  enabled: true
  hostnames: [ "git.${ROOT_DOMAIN}" ]
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https

image:
  rootless: true
  registry: code.forgejo.org
  repository: forgejo/forgejo
  tag: 13.0.2-rootless
  digest: sha256:a704cc203d78a854e0887e08fcbd7a45f9bc2b5fd8551c88b914b044792c4b1b

gitea:
  admin:
      username: ""
  #    existingSecret: forgejo-admin-secret
  #    email: "admin@ROOT_DOMAIN"

  # oauth:
  #   - name: kanidm
  #     provider: openidConnect
  #     existingSecret: kanidm-forgejo-oidc
  #     autoDiscoverUrl: "https://idm.${ROOT_DOMAIN}/oauth2/openid/forgejo/.well-known/openid-configuration"
  #
  config:
    database:
      DB_TYPE: postgres

      HOST: cluster-18-rw.database.svc.cluster.internal:5432
      USER: forgejo
      NAME: forgejo
      SSL_MODE: verify-full

    server:
      APP_DATA_PATH: /data/gitea
      ROOT_URL: https://git.${ROOT_DOMAIN}
      START_SSH_SERVER: true
      SSH_SERVER_HOST_KEYS: ssh/ssh_host_ed25519_key
    lfs:
      PATH: /data/git/lfs
    repository:
      ROOT: /data/git/repositories
    # repository.signing:
    #   FORMAT: ssh
    #   SIGNING_KEY: /data/ssh/id_ecdsa.pub
    #   SIGNING_NAME: "Forgejo"
    #   SIGNING_EMAIL: "forgejo@${ROOT_DOMAIN}"
    #
    #   INITIAL_COMMIT: pubkey
    #   CRUD_ACTIONS: pubkey, parentsigned
    #   WIKI: never
    #   MERGES: pubkey, basesigned, commitssigned
    indexer:
      ISSUE_INDEXER_TYPE: bleve
      REPO_INDEXER_ENABLED: true
    service:
      ALLOW_ONLY_EXTERNAL_REGISTRATION: true
      ENABLE_INTERNAL_SIGNIN: false
      SHOW_REGISTRATION_BUTTON: false
      ENABLE_PASSWORD_SIGNIN_FORM: false
      ENABLE_NOTIFY_MAIL: true
    openid:
      ENABLE_OPENID_SIGNIN: false
      ENABLE_OPENID_SIGNUP: false
    queue:
      TYPE: redis
      CONN_STR: redis://valkey.default.svc:6379/14?pool_size=100&idle_timeout=180s
    session:
      PROVIDER: redis
      PROVIDER_CONFIG: redis://valkey.default.svc:6379/14?pool_size=100&idle_timeout=180s
    cache:
      ENABLED: true
      ADAPTER: redis
      HOST: redis://valkey.default.svc:6379/14?pool_size=100&idle_timeout=180s
    mailer:
      ENABLED: true
      FROM: Forgejo <forgejo@${ROOT_DOMAIN}>
      PROTOCOL: smtp
      SMTP_ADDR: smtp-relay.default.svc.cluster.local
      USER: forgejo@${ROOT_DOMAIN}

# service:
#   ssh:
#     clusterIP: 2001:cafe:43::ef37

valkey-cluster:
  enabled: false
postgresql-ha:
  enabled: false

persistence:
  create: false
  claimName: ${APP}

extraVolumes:
  - name: git
    persistentVolumeClaim:
      claimName: git

  - name: forgejo-ssh
    secret:
      secretName: forgejo-ssh

extraContainerVolumeMounts:
  - name: git
    mountPath: "/data/git/"

  - name: forgejo-ssh
    mountPath: "/data/gitea/ssh/ssh_host_ed25519_key"
    subPath: ssh_host_ed25519_key
