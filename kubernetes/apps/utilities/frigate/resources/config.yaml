---
mqtt:
  host: mosquitto.utilities.svc.cluster.local
  topic_prefix: frigate
  user: "{FRIGATE_MQTT_USERNAME}"
  password: "{FRIGATE_MQTT_PASSWORD}"

ffmpeg:
  global_args: ["-hide_banner", "-loglevel", "info"]
  hwaccel_args: preset-nvidia-h264

detectors:
  tensorrt:
    type: tensorrt
    device: 0 #This is the default, select the first GPU

model:
  path: /trt-models/yolov7-tiny-416.trt
  input_tensor: nchw
  input_pixel_format: rgb
  width: 416
  height: 416

logger:
  default: info

database:
  path: /data/frigate.db

objects:
  track:
    - person

record:
  enabled: true
  retain:
    days: 5
    mode: all
  events:
    retain:
      default: 14
      mode: active_objects

snapshots:
  enabled: true
  timestamp: true
  bounding_box: true
  crop: false

go2rtc:
  streams:
    lounge_hq:
      - rtsp://${FRIGATE_RTSP_USERNAME}:${FRIGATE_RTSP_PASSWORD}@lounge.cams.${ROOT_DOMAIN}:554/stream1
    lounge_lq:
      - rtsp://${FRIGATE_RTSP_USERNAME}:${FRIGATE_RTSP_PASSWORD}@lounge.cams.${ROOT_DOMAIN}:554/stream2

cameras:
  lounge:
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-copy
      inputs:
        - path: rtsp://127.0.0.1:8554/lounge_hq
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/lounge_lq
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      fps: 15
      width: 640
      height: 480
