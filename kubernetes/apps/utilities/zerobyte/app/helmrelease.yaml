---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app zerobyte
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      zerobyte:
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: false
            runAsUser: 1000
        containers:
          app:
            env:
              BASE_URL: "https://{{ .Release.Name }}.${ROOT_DOMAIN}"
              LOG_LEVEL: debug
              TZ: ${TIMEZONE}
              WEBHOOK_ALLOWED_ORIGINS: https://matrix.${ROOT_DOMAIN}
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            image:
              repository: ghcr.io/nicotsx/zerobyte
              tag: v0.37.3@sha256:a396e211a15eeaec7fe0883ec7b699b0fe3128c150d3a6ac244dab35a1b37dc9
            resources:
              requests:
                cpu: 15m
                memory: 188M
              limits:
                cpu: 19088m
                memory: 56G
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /var/lib/zerobyte
      nfs:
        globalMounts:
          - path: /nfs
        path: ${NFS_PATH}
        server: ${NFS_HOST}
        type: nfs
      restic-cache:
        existingClaim: zerobyte-restic-cache
        globalMounts:
          - path: /var/lib/zerobyte/restic/cache
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: utilities
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Utilities
          gethomepage.dev/icon: *app
        hostnames:
          - "{{ .Release.Name }}.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: 4096
