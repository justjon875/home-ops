---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
spec:
  chart:
    spec:
      chart: goldilocks
      version: 10.2.0
      sourceRef:
        kind: HelmRepository
        name: fairwinds
      interval: 15m
  interval: 1h
  values:
    dashboard:
      replicaCount: 1
      resources:
        requests:
          cpu: null
          memory: 64M
        limits:
          memory: 64M
