apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubewall
  namespace: utilities
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 3.5.1
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  uninstall:
    keepHistory: false
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      kubewall:
        containers:
          app:
            image:
              repository: ghcr.io/kubewall/kubewall
              tag: 0.0.1@sha256:188b98441c011219a9a32effe47886801d3ab2d66e1fce14e429bfe09452a065
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: "{{ .Release.Name }}.${ROOT_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - "{{ .Release.Name }}.${ROOT_DOMAIN}"
    service:
      app:
        controller: kubewall
        ports:
          http:
            port: 7080
