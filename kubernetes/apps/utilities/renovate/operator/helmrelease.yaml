---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  interval: 15m
  values:
    fullnameOverride: renovate-operator
    route:
      annotations:
        gatus.home-operations.com/endpoint: |
          group: utilities
        gethomepage.dev/enabled: "true"
        gethomepage.dev/href: https://renovate.${ROOT_DOMAIN}
        gethomepage.dev/group: Utilities
        gethomepage.dev/icon: renovate
      enabled: true
      hostnames:
        - renovate.${ROOT_DOMAIN}
      parentRefs:
        - name: envoy-internal
          namespace: network
    webhook:
      enabled: true
