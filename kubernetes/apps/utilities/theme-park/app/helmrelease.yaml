apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app theme-park
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  uninstall:
    keepHistory: false
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      theme-park:
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/theme-park
              tag: 1.21.3@sha256:e883383aae4152201edb6277ed8e3925853e6d5f4a9ae8f961a95054045d4a91
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: "{{ .Release.Name }}.${ROOT_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - "{{ .Release.Name }}.${ROOT_DOMAIN}"
    service:
      app:
        controller: theme-park
        ports:
          http:
            port: 8080
