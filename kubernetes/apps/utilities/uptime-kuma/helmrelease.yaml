apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: &app uptime-kuma
  namespace: utilities
spec:
  chart:
    spec:
      chart: app-template
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 3.1.0
  install:
    createNamespace: true
    remediation:
      retries: 5
  interval: 15m
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      uptime-kuma:
        containers:
          app:
            env:
              TZ: ${TIMEZONE}
            image:
              repository: docker.io/louislam/uptime-kuma
              tag: 1.23.13@sha256:5ed40a58b56b689ec2af50230e8d28804503351fed5eb54b1aefe530a8ea1fdc
    ingress:
      app:
        className: nginx
        enabled: true
        hosts:
          - host: &host "uptime.${ROOT_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      data:
        globalMounts:
          - path: /app/data
        path: ${NFS_PATH}/uptime-kuma
        server: ${NFS_HOST}
        type: nfs
    service:
      app:
        controller: *app
        ports:
          http:
            port: 3001
