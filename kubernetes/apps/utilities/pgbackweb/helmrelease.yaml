---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pgbackweb
  namespace: utilities
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.6.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      pgbackweb:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/eduardolat/pgbackweb
              tag: 0.4.0@sha256:2b11998f1e53523f73068f9252c7810c29c6cfab16a9b348fd4d42c2bbfb9b9a
            env:
              TZ: "${TIMEZONE}"
              PBW_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: PBW_ENCRYPTION_KEY
              PBW_POSTGRES_CONN_STRING:
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: PBW_POSTGRES_CONN_STRING
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    ingress:
      app:
        className: internal
        enabled: true
        hosts:
          - host: &host pgbackweb.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8085
