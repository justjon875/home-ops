---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app postgres-client
spec:
  components:
    - ../../../../components/database
  interval: 1h
  path: ./kubernetes/apps/utilities/postgres-client/app
  postBuild:
    substitute:
      APP: *app
      DATABASE_EXTENSIONS: |
        [
          { name: timescaledb }
        ]
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: utilities
  wait: false
