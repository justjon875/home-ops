---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard-replicated
spec:
  chartRef:
    kind: OCIRepository
    name: adguard-replicated
  interval: 1h
  values:
    controllers:
      adguard-replicated:
        type: statefulset
        replicas: 2
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: adguard/adguardhome
              tag: v0.107.77@sha256:e6f2b8bcda06064ab055b44933a4f0e983c35558b9cdb8d2e7ab1efcee36d890
            env:
              TZ: ${TIMEZONE}
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 100m
          # unbound:
          #   image:
          #     repository: alpinelinux/unbound
          #     tag: latest@sha256:be4f836be211a721fd5d5d3cd6938a1ec4e836fed3644a45e909b88bdfde9333
          #   securityContext:
          #     allowPrivilegeEscalation: false
          #   resources:
          #     requests:
          #       cpu: 100m
          #     limits:
          #       memory: 512Mi
        pod:
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 1
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: adguard-replicated
                        app.kubernetes.io/component: adguard-replicated
        statefulset:
          volumeClaimTemplates:
            - name: data
              storageClass: ceph-block
              accessMode: ReadWriteOnce
              size: 1Gi
              globalMounts:
                - path: /opt/adguardhome/conf
                  subPath: conf
                - path: /opt/adguardhome/work
                  subPath: work
      sync:
        containers:
          app:
            image:
              repository: ghcr.io/bakito/adguardhome-sync
              tag: alpine-v0.9.2@sha256:1e3dad7c95228767779b21d354adfe1516c004839f3cb51d161e2c673f6d57c9
              pullPolicy: IfNotPresent
            args: [run]
            env:
              ORIGIN_URL: http://adguard-home-origin:3000
              ORIGIN_WEB_URL: https://ar.${ROOT_DOMAIN}
              ORIGIN_USERNAME: admin
              ORIGIN_PASSWORD: password
              REPLICA_URL: http://adguard-home-replica:3000
              REPLICA_WEB_URL: https://r.${ROOT_DOMAIN}
              REPLICA_USERNAME: admin
              REPLICA_PASSWORD: password
              REPLICA_AUTO_SETUP: "true"
              CRON: "*/10 * * * *"
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: { drop: [ALL] }
        pod:
          securityContext:
            runAsNonRoot: true
    service:
      origin: &origin-http
        controller: adguard-replicated
        extraSelectorLabels:
          apps.kubernetes.io/pod-index: "0"
        ports:
          http:
            port: 80
            primary: true
      dns:
        controller: adguard-replicated
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 172.16.0.153
        ports:
          dns-tcp:
            port: 53
            protocol: TCP
          dns-udp:
            port: 53
            protocol: UDP

      replica:
        <<: *origin-http
        extraSelectorLabels:
          apps.kubernetes.io/pod-index: "1"

      sync:
        controller: sync
        ports:
          http:
            port: 8080
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Utilities
          gethomepage.dev/icon: adguard-home
          gethomepage.dev/widget.type: adguard
          gethomepage.dev/widget.password: "{{ `{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}` }}"
          gethomepage.dev/widget.username: "{{ `{{HOMEPAGE_VAR_ADGUARD_USERNAME}}` }}"
          gethomepage.dev/widget.url: https://adguard-replicated.${ROOT_DOMAIN}
        forceRename: "{{ .Release.Name }}"
        hostnames:
          - "ar.${ROOT_DOMAIN}"
        parentRefs: &parentRefs
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: origin
                port: 80
      replica:
        parentRefs: *parentRefs
        hostnames:
          - "arr.${ROOT_DOMAIN}"
        rules:
          - backendRefs:
              - identifier: replica
                port: 80
    # persistence:
    #   unbound-config:
    #     type: configMap
    #     name: unbound-configmap
    #     advancedMounts:
    #       adguard-replicated:
    #         unbound:
    #           - path: "/etc/unbound/unbound.conf"
    #             subPath: "unbound.conf"
    #   root-hints:
    #     type: configMap
    #     name: unbound-configmap
    #     advancedMounts:
    #       adguard-replicated:
    #         unbound:
    #           - path: "/var/lib/unbound/root.hints"
    #             subPath: "root.hints"
