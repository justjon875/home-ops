---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opnsense-unbound-dns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    fullnameOverride: *app
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/crutonjohn/external-dns-opnsense-webhook
          tag:  v1.0.0@sha256:0bf02fe18db4fe3a86fe5f561313ee434a203f4dcee7d19e770f67df854f3cff 
        env:
          - name: OPNSENSE_HOST
            value: oxygen.${OLD_DOMAIN}
          - name: OPNSENSE_API_SECRET
            valueFrom:
              secretKeyRef:
                name: opnsense-unbound-dns-secret
                key: OPNSENSE_API_SECRET
          - name: OPNSENSE_API_KEY
            valueFrom:
              secretKeyRef:
                name: opnsense-unbound-dns-secret
                key: OPNSENSE_API_KEY
        securityContext:
          readOnlyRootFilesystem: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
    triggerLoopOnEvent: true
    # logLevel: debug
    policy: sync
    extraArgs:
      - --gateway-name=envoy-internal
    registry: noop
    sources:
      - gateway-grpcroute
      - gateway-httproute
      - gateway-tlsroute
      - gateway-udproute
      - gateway-tcproute
      - service

    txtOwnerId: default
    txtPrefix: k8s.
    domainFilters:
      - ${ROOT_DOMAIN}

    serviceMonitor:
      enabled: true
    podAnnotations:
      reloader.stakater.com/auto: "true"
