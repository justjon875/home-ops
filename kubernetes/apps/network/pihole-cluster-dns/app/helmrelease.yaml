---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pihole-cluster-dns
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    env:
      - name: EXTERNAL_DNS_PIHOLE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: pihole-cluster-dns-secret
            key: PIHOLE_PASSWORD
    extraArgs:
      - --pihole-api-version=6
      - --pihole-server=https://pihole.${ROOT_DOMAIN}
      - --gateway-name=envoy-internal
    interval: 1h
    podAnnotations:
      secret.reloader.stakater.com/reload: pihole-cluster-dns-secret
    policy: upsert-only
    provider:
      name: pihole
    registry: noop
    securityContext:
      readOnlyRootFilesystem: true
    sources: ["gateway-httproute", "gateway-tcproute", "crd"]
    triggerLoopOnEvent: true
