---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pihole-dns
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    provider:
      name: pihole
      webhook:
        env:
          - name: EXTERNAL_DNS_PIHOLE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: &secret pihole-dns-secret
                key: PIHOLE_PASSWORD
        securityContext:
          readOnlyRootFilesystem: true
    interval: 1h
    triggerLoopOnEvent: true
    policy: sync
    registry: noop
    sources: ["gateway-httproute", "gateway-tcproute", "crd"]
    extraArgs:
      - --pihole-api-version=6
      - --pihole-server=https://pihole.lithium.{OLD_DOMAIN}
      - --gateway-name=envoy-internal
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
    logLevel: debug
