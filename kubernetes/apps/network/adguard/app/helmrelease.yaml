---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard
spec:
  chartRef:
    kind: OCIRepository
    name: adguard
  interval: 1h
  values:
    controllers:
      adguard:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          adguard:
            image:
              repository: adguard/adguardhome
              tag: v0.107.77@sha256:e6f2b8bcda06064ab055b44933a4f0e983c35558b9cdb8d2e7ab1efcee36d890
            env:
              TZ: ${TIMEZONE}
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 100m
          unbound:
            image:
              repository: alpinelinux/unbound
              tag: latest@sha256:be4f836be211a721fd5d5d3cd6938a1ec4e836fed3644a45e909b88bdfde9333
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 512Mi
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${ADGUARD_DNS_HOST}
        ports:
          http:
            primary: true
            port: &adguard-port 80
          dns-udp:
            port: 53
            protocol: UDP
          dns-tcp:
            port: 53
            protocol: TCP
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Utilities
          gethomepage.dev/icon: adguard-home
          gethomepage.dev/widget.type: adguard
          gethomepage.dev/widget.password: "{{ `{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}` }}"
          gethomepage.dev/widget.username: "{{ `{{HOMEPAGE_VAR_ADGUARD_USERNAME}}` }}"
          gethomepage.dev/widget.url: https://adguard.${ROOT_DOMAIN}
        forceRename: "{{ .Release.Name }}"
        hostnames:
          - "adguard.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *adguard-port
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          adguard:
            adguard:
              - path: /opt/adguardhome/conf
              - path: /opt/adguardhome/work
      unbound-config:
        type: configMap
        name: unbound-configmap
        advancedMounts:
          adguard:
            unbound:
              - path: "/etc/unbound/unbound.conf"
                subPath: "unbound.conf"
      root-hints:
        type: configMap
        name: unbound-configmap
        advancedMounts:
          adguard:
            unbound:
              - path: "/var/lib/unbound/root.hints"
                subPath: "root.hints"
