---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: technitium
spec:
  chartRef:
    kind: OCIRepository
    name: technitium
  interval: 1h
  values:
    controllers:
      companion:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          companion:
            image:
              repository: ghcr.io/fail-safe/technitium-dns-companion
              tag: 1.9.0@sha256:f828922d7627e2c1944b1f386feaa68f1888520361c10f45a301d3345a435e76
            env:
              DNS_SERVER_DOMAIN: technitium.${ROOT_DOMAIN}
              TECHNITIUM_NODES: node1
              TECHNITIUM_NODE1_NAME: "Primary"
              TECHNITIUM_NODE1_BASE_URL: "https://{{ .Release.Name }}.${ROOT_DOMAIN}"
              TECHNITIUM_NODE2_NAME: "Secondary"
              TECHNITIUM_NODE2_BASE_URL: http://technitium-seconary-0.svc.cluster.local
              TECHNITIUM_NODE3_NAME: "Tertiary"
              TECHNITIUM_NODE3_BASE_URL: http://technitium-seconary-0.svc.cluster.local
              TIMEZONE: ${TIMEZONE}
              TRUST_PROXY: "true"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-companion-secret"
            securityContext:
              allowPrivilegeEscalation: false
      primary:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          technitium:
            image:
              repository: technitium/dns-server
              tag: 15.4.0@sha256:df7d90ef0f7b6fff6916d291a7022cd902290cc31c3141d4158b6c375a641b41
            env:
              DNS_SERVER_DOMAIN: technitium.${ROOT_DOMAIN}
            securityContext:
              allowPrivilegeEscalation: false
      secondary:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          technitium:
            image:
              repository: technitium/dns-server
              tag: 15.4.0@sha256:df7d90ef0f7b6fff6916d291a7022cd902290cc31c3141d4158b6c375a641b41
            env:
              DNS_SERVER_DOMAIN: technitium.${ROOT_DOMAIN}
            securityContext:
              allowPrivilegeEscalation: false
        replicas: 2
    persistence:
      dns:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          primary:
            technitium:
              - path: /etc/dns
          secondary:
            technitium:
              - path: /etc/dns
    route:
      companion:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Utilities
          gethomepage.dev/icon: technitium-companion
        hostnames:
          - "tc.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: companion
                port: 3000
      primary:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Utilities
          gethomepage.dev/icon: technitium
          gethomepage.dev/widget.type: technitium
          gethomepage.dev/widget.url: https://technitium.${ROOT_DOMAIN}
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_TECHNITIUM_KEY}}` }}"
          gethomepage.dev/widget.range: LastDay
        forceRename: "{{ .Release.Name }}"
        hostnames:
          - "technitium.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: technitium
                port: 5380
    service:
      companion:
        ports:
          http:
            port: 3000
      http:
        controller: primary
        port: 5380
      technitium:
        controller: primary
        extraSelectorLabels:
          name: technitium
        forceRename: "{{ .Release.Name }}"
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${TECHNITIUM_DNS_HOST}
        ports:
          dns-udp:
            port: 53
            protocol: UDP
          dns-tcp:
            port: 53
            protocol: TCP
