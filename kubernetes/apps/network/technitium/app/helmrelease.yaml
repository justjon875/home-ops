---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: technitium
spec:
  chartRef:
    kind: OCIRepository
    name: technitium
  interval: 1h
  values:
    controllers:
      technitium:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          companion:
            image:
              repository: ghcr.io/fail-safe/technitium-dns-companion
              tag: 1.8.2@sha256:b92788cdfec0f4ff9aa09895478ee008ba21d5b31342eae0af4b686e9744644b
            env:
              DNS_SERVER_DOMAIN: technitium.${ROOT_DOMAIN}
              TECHNITIUM_NODES: node1
              TECHNITIUM_NODE1_NAME: "DNS Primary"
              TECHNITIUM_NODE1_BASE_URL: "https://{{ .Release.Name }}.${ROOT_DOMAIN}"
              TIMEZONE: ${TIMEZONE}
              TRUST_PROXY: "true"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-companion-secret"
            securityContext:
              allowPrivilegeEscalation: false
          technitium:
            image:
              repository: technitium/dns-server
              tag: 15.4.0@sha256:df7d90ef0f7b6fff6916d291a7022cd902290cc31c3141d4158b6c375a641b41
            env:
              DNS_SERVER_DOMAIN: technitium.${ROOT_DOMAIN}
            securityContext:
              allowPrivilegeEscalation: false
    persistence:
      dns:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          technitium:
            technitium:
              - path: /etc/dns
    route:
      companion:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Utilities
          gethomepage.dev/icon: technitium-companion
        hostnames:
          - "tc.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: companion
                port: 3000
      technitium:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Utilities
          gethomepage.dev/icon: technitium
          gethomepage.dev/widget.type: technitium
          gethomepage.dev/widget.password: "{{ `{{HOMEPAGE_VAR_technitium_PASSWORD}}` }}"
          gethomepage.dev/widget.username: "{{ `{{HOMEPAGE_VAR_technitium_USERNAME}}` }}"
          gethomepage.dev/widget.url: https://technitium.${ROOT_DOMAIN}
        forceRename: "{{ .Release.Name }}"
        hostnames:
          - "technitium.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: technitium
                port: 5380
    service:
      companion:
        ports:
          http:
            port: 3000
      technitium:
        forceRename: "{{ .Release.Name }}"
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${TECHNITIUM_DNS_HOST}
        ports:
          http:
            primary: true
            port: 5380
          dns-udp:
            port: 53
            protocol: UDP
          dns-tcp:
            port: 53
            protocol: TCP
