---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "${ROOT_DOMAIN/./-}-production"
spec:
  secretName: "${ROOT_DOMAIN/./-}-prod-tls"
  issuerRef:
    name: letsencrypt-prod-clusterissuer
    kind: ClusterIssuer
  commonName: "${ROOT_DOMAIN}"
  dnsNames: ["${ROOT_DOMAIN}", "*.${ROOT_DOMAIN}"]
