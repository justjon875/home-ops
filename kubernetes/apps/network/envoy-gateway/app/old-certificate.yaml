---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "${OLD_DOMAIN/./-}-production"
spec:
  secretName: "${OLD_DOMAIN/./-}-prod-tls"
  issuerRef:
    name: letsencrypt-prod-clusterissuer
    kind: ClusterIssuer
  commonName: "${OLD_DOMAIN}"
  dnsNames: ["${OLD_DOMAIN}", "*.${ROOT_DOMAIN}"]
