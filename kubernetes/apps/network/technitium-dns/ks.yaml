---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appName technitium-dns
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appName
  dependsOn:
    - name: technitium
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/network/technitium-dns
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      - name: cluster-settings
        kind: ConfigMap
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
