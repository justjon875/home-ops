---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app technitium-dns
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 30m
  values:
    podAnnotations:
      secret.reloader.stakater.com/reload: &secret technitium-dns-secret
    fullnameOverride: *app
    provider:
      name: rfc2136
    env:
      - name: &name EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: *secret
            key: *name
    extraArgs:
      - --rfc2136-host=${TECHNITIUM_DNS_HOST}
      - --rfc2136-port=53
      - --rfc2136-zone=${ROOT_DOMAIN}
      - --rfc2136-zone=${OLD_DOMAIN}
      - --rfc2136-tsig-secret-alg=hmac-sha256
      - --rfc2136-tsig-keyname=external-dns
      - --rfc2136-tsig-axfr
    policy: upsert-only
    sources:
      - crd
      - service
      - gateway-httproute
      - gateway-grpcroute
      - gateway-tlsroute
      - gateway-tcproute
      - gateway-udproute
    serviceMonitor:
      enabled: true
