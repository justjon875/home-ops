---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
spec:
  chartRef:
    kind: OCIRepository
    name: pihole
  interval: 1h
  values:
    controllers:
      pihole:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          pihole:
            image:
              repository: ghcr.io/pi-hole/pihole
              tag: 2026.02.0@sha256:ee348529cea9601df86ad94d62a39cad26117e1eac9e82d8876aa0ec7fe1ba27
            env:
              TZ: ${TIMEZONE}
              FTLCONF_dns_listeningMode: all
              FTLCONF_dns_upstreams: 127.0.0.1#5335
              FTLCONF_dns_dnssec: true
              FTLCONF_misc_dnsmasq_lines: "server=/${OLD_DOMAIN}/#;address=/.lithium.${OLD_DOMAIN}/192.168.1.200"
              FTLCONF_webserver_interface_boxed: false
              FTLCONF_webserver_interface_theme: default-darker
              FTLCONF_webserver_port: &pihole-port 80
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 100m
              limits:
                # looking at the query log can spike the memory usage very high
                memory: 512Mi
          unbound:
            image:
              repository: alpinelinux/unbound
              tag: latest@sha256:04168630aaf08545cf84fb6ccd414951495aa5cdd96b63e8531c2eb30db698cc
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 512Mi
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${DNS_HOST}
        primary: true
        ports:
          http:
            primary: true
            port: *pihole-port
          dns-udp:
            port: 53
            protocol: UDP
          dns-tcp:
            port: 53
            protocol: TCP
    serviceMonitor:
      app:
        forceRename: "{{ .Release.Name }}"
        service:
          identifier: app
        endpoints:
          - port: prometheus # exporter-port's name
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 1m
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 403"]
        forceRename: "{{ .Release.Name }}"
        hostnames:
          - "pihole.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *pihole-port
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          pihole:
            app:
              - path: /etc/pihole
                subPath: pihole
              - path: /final
                subPath: init
      unbound-config:
        type: configMap
        name: unbound-configmap
        advancedMounts:
          pihole:
            unbound:
              - path: "/etc/unbound/unbound.conf"
                subPath: "unbound.conf"
      root-hints:
        type: configMap
        name: root-hints
        advancedMounts:
          pihole:
            unbound:
              - path: "/var/lib/unbound/root.hints"
                subPath: "root.hints"
