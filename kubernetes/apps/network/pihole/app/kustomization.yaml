---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./grafanadashboard.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: root-hints
    files:
      - config.yaml=./resources/root.hints
  - name: unbound-configmap
    files:
      - config.yaml=./resources/unbound.conf
generatorOptions:
  disableNameSuffixHash: true
