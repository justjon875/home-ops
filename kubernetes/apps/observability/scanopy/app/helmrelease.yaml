---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app podfetch
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      podfetch:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-initdb-secret"
        containers:
          server:
            env:
              SCANOPY_INTEGRATED_DAEMON_URL: http://127.0.0.1:60073
              SCANOPY_WEB_EXTERNAL_PATH: /app/static
              SCANOPY_PUBLIC_URL: https://{{ .Release.Name }}.${ROOT_DOMAIN}
              SCANOPY_DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-pguser-secret"
                    key: uri
            image:
              repository: ghcr.io/scanopy/scanopy/server
              tag: v0.15.3@sha256:423f0448ff2b5d852db816fbb748b72e2e6478c13fa079a6dfa263ac0a2c8987
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    persistence:
      data:
        existingClaim: *app
    route:
      server:
        hostnames:
          - "{{ .Release.Name }}.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      server:
        ports:
          http:
            port: 60072
