---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app busybox
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      busybox:
        containers:
          app:
            command:
              - sleep
              - "3600"
            image:
              repository: docker.io/library/busybox
              tag: latest
            env:
              GATUS_CONFIG_PATH: /config
              GATUS_DELAY_START_SECONDS: 5
              GATUS_WEB_PORT: &port 80
              GATUS_LOG_LEVEL: DEBUG
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: gatus-secret
    service:
      app:
        enabled: false
        controller: *app
    persistence:
      config:
        type: emptyDir
      config-file:
        type: configMap
        name: "{{ .Release.Name }}-configmap"
        globalMounts:
          - path: /config/alerts.yaml
            subPath: alerts.yaml
          - path: /config/config.yaml
            subPath: config.yaml
