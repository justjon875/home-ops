---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 75.5.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    cleanPrometheusOperatorObjectNames: true
    grafana:
      enabled: false
      forceDeployDashboards: true
    prometheus:
      route:
        main:
          enabled: true
          hostnames: ["prometheus.${SHORT_ROOT_DOMAIN}"]
          parentRefs:
            - name: internal
              namespace: kube-system
              sectionName: https
      prometheusSpec:
        retention: 2d
        retentionSize: 6GB
        enableAdminAPI: true
        walCompression: true
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: rook-ceph-block
              resources:
                requests:
                  storage: 20Gi
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
    alertmanager:
      enabled: false
      ingress:
        enabled: true
        ingressClassName: internal
        hosts:
          - alertmanager.${SHORT_ROOT_DOMAIN}
        tls:
          - hosts:
              - alertmanager.${SHORT_ROOT_DOMAIN}
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ["alertname", "job"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 6h
          receiver: opsgenie-warning
          routes:
            - receiver: healthchecksio
              group_wait: 0s
              group_interval: 1m
              repeat_interval: 1m
              matchers:
                - alertname = "Watchdog"
            - receiver: "null"
              matchers:
                - alertname = "InfoInhibitor"
            - receiver: opsgenie-critical
              matchers:
                - severity =~ "critical|alert"
              continue: true
            - receiver: opsgenie-warning
              matchers:
                - severity = "warning"
              continue: true
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi
    kubeControllerManager:
      enabled: true
      serviceMonitor:
        enabled: true
        https: true
        insecureSkipVerify: true
    kubeScheduler:
      enabled: true
      serviceMonitor:
        enabled: true
        https: true
        insecureSkipVerify: true
    kubeProxy:
      enabled: false
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
