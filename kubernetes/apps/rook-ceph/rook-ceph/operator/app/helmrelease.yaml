---
# yaml-language-server: $schema=https://schemas.budimanjojo.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  interval: 1h
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-operator
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
  values:
    crds:
      enabled: true
    monitoring:
      enabled: true
    pspEnable: false
    csi:
      enableCephfsDriver: false
    resources:
      requests:
        cpu: 92m
        memory: 249Mi
      limits:
        memory: 350Mi
