---
clusterName: home-cluster
talosVersion: v1.11.5
kubernetesVersion: v1.34.1
endpoint: https://cluster.habanerojam.xyz:6443
allowSchedulingOnMasters: true
cniConfig:
  name: none
patches:
  - "@./patches/global/machine-sysctls.yaml"
  - "@./patches/controller/cluster.yaml"
  - |-
    machine:
      kubelet:
        extraMounts:
          - destination: /var/openebs/local
            type: bind
            source: /var/openebs/local
            options:
              - rbind
              - rshared
              - rw
          - destination: /var/mnt/host-nvme
            type: bind
            source: /var/mnt/host-nvme
            options:
              - bind
              - rshared
              - rw
nodes:
  - hostname: master1
    ipAddress: 192.168.3.25
    controlPlane: true
    installDisk: /dev/sda
    nameservers:
      - 192.168.3.1
    networkInterfaces:
      - interface: ens18
        addresses:
          - 192.168.3.25/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.3.1
  - hostname: master2
    ipAddress: 192.168.3.26
    controlPlane: true
    installDisk: /dev/sda
    nameservers:
      - 192.168.3.1
    networkInterfaces:
      - interface: ens18
        addresses:
          - 192.168.3.26/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.3.1
controlPlane:
  nodeLabels:
    node.longhorn.io/create-default-disk: 'config'
  nodeAnnotations:
    node.longhorn.io/default-disks-config:
      '[{
          "name":"longhorn-nvme",
          "path":"/var/mnt/host-nvme/",
          "storageReserved":0,
          "tags": ["ultra-fast", "ssd"],
          "allowScheduling":true
        }]'
  nodeTaints: {}
  schematic:
    customization:
      extraKernelArgs:
        - net.ifnames=0
      systemExtensions:
        officialExtensions:
          - siderolabs/nfsrahead # NFS Performance
          - siderolabs/iscsi-tools
          - siderolabs/util-linux-tools
  userVolumes:
    - name: EPHEMERAL
      provisioning:
        diskSelector:
          match: system_disk
        maxSize: 50GiB
    - name: host-nvme
      provisioning:
        diskSelector:
          match: "!system_disk"
        minSize: 50GiB
        grow: true
