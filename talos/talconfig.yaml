---
clusterName: home-cluster
talosVersion: v1.12.7
kubernetesVersion: v1.35.2
endpoint: https://cluster.habjam.xyz:6443
allowSchedulingOnControlPlanes: true
cniConfig:
  name: none
patches:
  - "@./patches/global/machine-sysctls.yaml"
  - "@./patches/controller/cluster.yaml"
  - "@./patches/controller/admission-controller-patch.yaml"
  - |-
    machine:
      features:
          kubernetesTalosAPIAccess:
              allowedKubernetesNamespaces:
                  - system-upgrade # or the namespace the controller will be installed to
              allowedRoles:
                  - os:admin
              enabled: true
      kubelet:
        extraMounts:
          - destination: /var/mnt/local-hostpath
            type: bind
            source: /var/mnt/local-hostpath
            options:
              - rbind
              - rshared
              - rw
          - destination: /var/mnt/host-nvme
            type: bind
            source: /var/mnt/host-nvme
            options:
              - bind
              - rshared
              - rw
nodes:
  - hostname: hydrogen1
    ipAddress: 192.168.3.206
    controlPlane: true
    installDisk: /dev/sda
    nameservers:
      - 192.168.1.200
    networkInterfaces:
      - interface: ens18
        mtu: 1420
        addresses:
          - 192.168.3.206/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.3.1
    kernelModules:
      - name: gasket
      - name: apex
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/nfsrahead # NFS Performance
            - siderolabs/gasket-driver
  - hostname: neon1
    ipAddress: 192.168.3.211
    controlPlane: true
    installDisk: /dev/sda
    nameservers:
      - 192.168.1.200
    networkInterfaces:
      - interface: eth0
        mtu: 1420
        addresses:
          - 192.168.3.211/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.3.1
  - hostname: neon2
    ipAddress: 192.168.3.212
    controlPlane: true
    installDisk: /dev/sda
    nameservers:
      - 192.168.1.200
    networkInterfaces:
      - interface: eth0
        mtu: 1420
        addresses:
          - 192.168.3.212/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.3.1
controlPlane:
  userVolumes:
    - name: EPHEMERAL
      provisioning:
        diskSelector:
          match: system_disk
        maxSize: 100GiB
    - name: local-hostpath
      provisioning:
        diskSelector:
          match: system_disk
        minSize: 50GiB
        grow: true

    # - name: host-nvme
    #   provisioning:
    #     diskSelector:
    #       match: "!system_disk"
    #     minSize: 50GiB
    #     grow: true
