---
clusterName: home-cluster
talosVersion: v1.11.5
kubernetesVersion: v1.34.1
endpoint: https://cluster.habanerojam.xyz:6443
allowSchedulingOnMasters: true
cniConfig:
  name: none
patches:
  - "@./patches/global/machine-sysctls.yaml"
  - |-
    machine:
      kubelet:
        extraMounts:
          - destination: /var/openebs/local
            type: bind
            source: /var/openebs/local
            options:
              - rbind
              - rshared
              - rw
          - destination: /var/lib/longhorn
            type: bind
            source: /var/lib/longhorn
            options:
              - bind
              - rshared
              - rw
nodes:
  - hostname: master1
    ipAddress: 192.168.3.25
    controlPlane: true
    installDisk: /dev/sda
    nameservers:
      - 192.168.3.1
    networkInterfaces:
      - interface: ens18
        addresses:
          - 192.168.3.25/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.3.1
  - hostname: master2
    ipAddress: 192.168.3.26
    controlPlane: true
    installDisk: /dev/sda
    nameservers:
      - 192.168.3.1
    networkInterfaces:
      - interface: ens18
        addresses:
          - 192.168.3.26/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.3.1
  - hostname: master3
    ipAddress: 192.168.3.27
    controlPlane: true
    installDisk: /dev/sda
    nameservers:
      - 192.168.3.1
    networkInterfaces:
      - interface: ens18
        addresses:
          - 192.168.3.27/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.3.1
controlPlane:
  patches:
    - |-
      cluster:
        coreDNS:
          disabled: true
        proxy:
          disabled: true
  schematic:
    customization:
      extraKernelArgs:
        - net.ifnames=0
      systemExtensions:
        officialExtensions:
          - siderolabs/nfsrahead # NFS Performance
  userVolumes:
    - name: EPHEMERAL
      provisioning:
        diskSelector:
          match: system_disk
        maxSize: 50GiB
